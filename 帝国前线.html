<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>帝国前线 — 六边形随机大陆回合制策略游戏</title>
  <style>
/* style.css — 帝国前线 界面样式 */
:root {
  --bg: #0e1620;
  --panel: #16202c;
  --panel2: #1c2936;
  --border: #2a3a4d;
  --text: #dbe6f0;
  --dim: #7e93a8;
  --accent: #4ade80;
  --gold: #ffd54a;
  --danger: #f87171;
  --blue: #60a5fa;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

#app { height: 100vh; display: flex; flex-direction: column; }

/* ---------- 顶部栏 ---------- */
#topbar {
  height: 48px;
  display: flex; align-items: center; gap: 14px;
  padding: 0 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
.brand { font-weight: 800; font-size: 16px; letter-spacing: 1px; color: var(--gold); }
.top-item { white-space: nowrap; }
.top-spacer { flex: 1; }
.top-btn { height: 30px; }

/* ---------- 中部 ---------- */
#main { flex: 1; display: flex; min-height: 0; }

#sidebar {
  width: 292px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 12px;
}
#canvas-wrap { flex: 1; position: relative; min-width: 0; }
#game-canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
#phase-banner {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.7); padding: 8px 18px; border-radius: 8px;
  font-size: 15px; color: var(--gold); pointer-events: none;
}
#event-panel {
  width: 300px;
  background: var(--panel);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
}
.panel-title {
  padding: 10px 12px; font-weight: 700; font-size: 13px;
  border-bottom: 1px solid var(--border); color: var(--dim);
}
#event-list { flex: 1; overflow-y: auto; padding: 8px 10px; }
.event-item {
  font-size: 12.5px; padding: 4px 6px; border-radius: 4px;
  border-bottom: 1px dashed rgba(255,255,255,0.06);
}
.ev-turn { color: var(--blue); font-weight: 700; margin-right: 4px; }

/* ---------- 底部栏 ---------- */
#bottombar {
  height: 50px;
  display: flex; align-items: center; gap: 16px;
  padding: 0 14px;
  background: var(--panel);
  border-top: 1px solid var(--border);
  font-size: 13px;
}
#hint { color: var(--dim); flex: 1; }

/* ---------- 按钮 ---------- */
.btn {
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 14px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  transition: filter 0.12s, transform 0.05s;
}
.btn:hover { filter: brightness(1.2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: #1d5e3c; border-color: #2c7a4f; color: #eafff2; }
.btn.danger { border-color: #8a3c3c; color: var(--danger); }
.btn.danger-btn { background: #5a2a2a; border-color: #8a3c3c; color: #ffd7d7; }
.btn.small { padding: 4px 9px; font-size: 12px; }
.btn.big { width: 100%; padding: 12px; font-size: 15px; margin-top: 14px; }
.btn.disabled { opacity: 0.45; cursor: not-allowed; }
.btn.disabled:hover { filter: none; }
.action-btn { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; text-align: left; }
.action-btn .cost { color: var(--gold); font-size: 12px; }
.btn.block { width: 100%; margin-bottom: 6px; }
.btn-grid { display: flex; flex-direction: column; gap: 0; }
kbd {
  background: #0b1117; border: 1px solid var(--border); border-bottom-width: 2px;
  border-radius: 4px; padding: 1px 6px; font-size: 11px; font-family: inherit;
}

/* ---------- 侧栏信息 ---------- */
.hint-text { color: var(--dim); font-size: 13px; line-height: 1.9; padding: 6px 0; }

/* ---------- 可折叠面板（微信置顶式：点击标题展开/收起） ---------- */
.coll { margin-bottom: 12px; }
.coll-head {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; cursor: pointer; user-select: none;
  font-weight: 700; font-size: 13px;
}
.coll-head:hover { filter: brightness(1.15); }
.coll-title { color: var(--text); }
.coll-arrow { color: var(--dim); font-size: 12px; transition: transform 0.18s ease; }
.coll-body { padding: 6px 2px 0; }
.coll.collapsed .coll-arrow { transform: rotate(-90deg); }
.coll.collapsed .coll-body { display: none; }
.tile-name { font-size: 17px; font-weight: 800; margin-bottom: 6px; }
.tile-meta { font-size: 13px; color: var(--text); margin-bottom: 4px; opacity: 0.92; }
.army-line { font-size: 14px; margin: 8px 0 4px; padding: 6px 8px; background: var(--panel2); border-radius: 6px; }
.section-title {
  font-size: 12px; color: var(--dim); font-weight: 700; letter-spacing: 1px;
  margin: 14px 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px;
}
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; margin-right: 3px; }

/* ---------- 遮罩 / 弹窗 ---------- */
.overlay {
  position: fixed; inset: 0;
  background: rgba(6, 10, 16, 0.78);
  backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center;
  z-index: 50;
}
.overlay.hidden { display: none; }
.modal {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 26px 30px;
  width: 480px;
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
.modal.wide { width: 760px; }
.modal h1 { font-size: 30px; text-align: center; color: var(--gold); }
.modal h2 { font-size: 20px; margin-bottom: 12px; }
.modal .sub { text-align: center; color: var(--dim); margin: 6px 0 16px; font-size: 13px; }
.modal-btns { display: flex; justify-content: center; gap: 10px; margin-top: 18px; }
.dim { color: var(--dim); font-size: 12px; }
.foot { margin-top: 16px; text-align: center; }

/* ---------- 菜单表单 ---------- */
.menu-form { margin-top: 8px; }
.form-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.form-row label { width: 84px; font-size: 13px; color: var(--dim); }
.form-row select, .form-row input[type="number"] {
  background: var(--panel2); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 7px 10px; font-size: 13px; font-family: inherit;
}
.form-row input[type="range"] { flex: 1; }
.form-row input[type="number"] { width: 90px; }
#nation-count-label { font-size: 13px; color: var(--gold); min-width: 40px; }

#nation-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 6px; }
.nation-chip {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  cursor: pointer;
  font-size: 14px;
  display: flex; align-items: center; gap: 8px;
  background: var(--panel2);
  transition: border-color 0.12s;
}
.nation-chip::before {
  content: ''; width: 12px; height: 12px; border-radius: 50%;
  background: var(--nc);
}
.nation-chip:hover { border-color: var(--blue); }
.nation-chip.selected { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(255,213,74,0.25); }

/* ---------- 外交 ---------- */
.dip-row {
  display: grid; grid-template-columns: 1.2fr 0.7fr 0.9fr 1fr auto;
  gap: 10px; align-items: center;
  padding: 10px 8px; border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.dip-nation { font-weight: 700; }
.dip-rel { color: var(--blue); }
.dip-power { color: var(--dim); }
.dip-status { color: var(--dim); font-size: 12px; }
.dip-btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

/* ---------- 存档 ---------- */
.slot-row {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 8px; border-bottom: 1px solid var(--border);
}
.slot-info { flex: 1; font-size: 13px; }

/* ---------- 结算 ---------- */
.victory-title { font-size: 40px; font-weight: 900; text-align: center; margin: 6px 0 10px; }
.victory-title.win { color: var(--gold); }
.victory-title.lose { color: var(--danger); }
#victory-sub { text-align: center; font-size: 15px; margin-bottom: 14px; }
.victory-stats {
  background: var(--panel2); border-radius: 8px;
  padding: 14px 18px; font-size: 14px; line-height: 2;
  text-align: center;
}

/* ---------- Toast ---------- */
#toast {
  position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: rgba(10, 18, 28, 0.94);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 22px;
  border-radius: 8px;
  font-size: 14px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
  z-index: 100;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- 科技树 ---------- */
/* 科技树：整棵树占更大屏幕，拖拽平移（钢铁雄心4式），关闭按钮固定在右上角 */
.tech-modal { width: 92vw; max-width: 1500px; height: 88vh; display: flex; flex-direction: column; padding: 18px 20px; }
#tech-overlay .modal-close { position: fixed; top: 12px; right: 14px; z-index: 10; }
#tech-viewport {
  flex: 1; min-height: 0; overflow: auto; cursor: grab;
  border: 1px solid var(--border); border-radius: 10px; background: var(--panel);
  margin-top: 12px;
  /* 隐藏滚动条：用拖拽平移代替 */
  scrollbar-width: none;
}
#tech-viewport::-webkit-scrollbar { width: 0; height: 0; display: none; }
#tech-viewport.dragging { cursor: grabbing; }
#tech-canvas {
  display: flex; flex-direction: column; gap: 14px; width: max-content; min-width: 100%;
  padding: 12px 14px 16px;
}
.tech-track { background: var(--panel2); border-radius: 8px; padding: 12px 14px; white-space: nowrap; }
.tech-track-title { font-weight: 800; font-size: 15px; margin-bottom: 10px; color: var(--gold); }
.tech-node {
  padding: 7px 10px; border-radius: 6px; font-size: 13px;
  border: 1px solid var(--border); margin-bottom: 6px;
  background: var(--panel); color: var(--dim);
}
.tech-node.owned { color: var(--text); border-color: #2c7a4f; }
.tech-node.next { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 8px rgba(255,213,74,0.25); }
.tech-done { color: var(--accent); font-size: 13px; padding-top: 6px; }
.tech-track .btn { margin-top: 4px; margin-right: 4px; }
.tech-slider-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--dim); }
.tech-slider-row label { flex: none; }
.tech-slider { flex: 1; accent-color: #1d5e3c; }
.tech-slider-val { flex: none; min-width: 88px; text-align: right; font-weight: 700; color: var(--gold); }
.tech-slider-hint { font-size: 11px; color: var(--dim); margin-top: 2px; }
/* 每条科技线独占一行：节点从左往右横向排布 */
.tech-nodes-row { display: flex; flex-direction: row; gap: 8px; padding-bottom: 4px; align-items: stretch; }
.tech-nodes-row .tech-node { min-width: 110px; max-width: 150px; flex: 0 0 auto; white-space: normal; cursor: pointer; }
.tech-node.locked { opacity: 0.45; border-style: dashed; }
.tech-node.locked:hover { opacity: 0.8; }
.tech-req { font-size: 10px; color: #ff9a6b; margin-top: 4px; line-height: 1.25; }
.jump-highlight { box-shadow: 0 0 14px var(--gold); border-color: var(--gold) !important; }
.tech-open-lock { font-size: 12px; color: #ff9a6b; background: rgba(255,120,80,0.1); border: 1px dashed #ff7a5c; border-radius: 6px; padding: 5px 8px; margin-bottom: 6px; cursor: pointer; }
.tech-open-lock:hover { background: rgba(255,120,80,0.2); }
.slider-wrap { padding: 12px 4px; }
.slider-wrap input { width: 100%; accent-color: #1d5e3c; }
.slider-wrap #slider-value { text-align: center; font-size: 22px; font-weight: 800; color: var(--gold); margin-top: 8px; }
.build-tip {
  position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%);
  background: rgba(10,18,26,0.94); color: var(--text); border: 1px solid var(--gold);
  border-radius: 8px; padding: 8px 14px; font-size: 13px; max-width: 460px;
  opacity: 0; transition: opacity 0.3s ease; pointer-events: none; z-index: 300; text-align: center;
}
.build-tip.show { opacity: 1; }

/* ---------- 教程面板 ---------- */
#tutorial-panel {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: 64px;
  background: rgba(10, 18, 28, 0.96);
  border: 1px solid var(--gold);
  border-radius: 12px;
  padding: 14px 20px;
  width: min(640px, 92vw);
  z-index: 40;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  font-size: 14px;
  line-height: 1.8;
}
#tutorial-panel.hidden { display: none; }
#tutorial-text b { color: var(--gold); }
.tutorial-body { color: var(--text); font-size: 13px; }
.tutorial-btns { display: flex; gap: 10px; margin-top: 10px; justify-content: flex-end; }

/* ---------- 滚动条 ---------- */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a3a4d; border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: #3a4f66; }

/* ---------- 面板折叠 ---------- */
#sidebar { transition: width 0.22s ease; }
#sidebar.collapsed { width: 0; padding: 0; overflow: hidden; border-right: none; }
#event-panel { transition: width 0.22s ease; }
#event-panel.collapsed { width: 0; padding: 0; overflow: hidden; border-left: none; }

/* ---------- 成就面板 ---------- */
.ach-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.ach-card { display: flex; align-items: center; gap: 10px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; opacity: 0.55; }
.ach-card.owned { opacity: 1; border-color: var(--gold); }
.ach-icon { font-size: 24px; }
.ach-name { font-weight: 800; font-size: 13px; }
.ach-desc { font-size: 12px; color: var(--dim); }
.ach-state { margin-left: auto; font-size: 16px; color: var(--gold); }

/* ---------- 政策面板 ---------- */
.policy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.policy-card { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
.policy-card.owned { border-color: #2c7a4f; }
.policy-name { font-weight: 800; font-size: 14px; margin-bottom: 4px; }
.policy-lvl { font-weight: 700; color: var(--gold); font-size: 12px; }
.policy-desc { font-size: 12.5px; color: var(--dim); line-height: 1.7; margin-bottom: 6px; }
.pol-dots { display: flex; gap: 6px; margin: 6px 0 10px; }
.pol-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--panel); border: 1px solid var(--border); }
.pol-dot.on { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 6px rgba(255,213,74,0.5); }
.policy-owned { color: var(--accent); font-size: 12px; }
.policy-enact { padding: 4px 12px; }

/* ---------- 弹窗右上角圆形关闭按钮 ---------- */
.modal-close {
  position: absolute; top: 12px; right: 12px;
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--panel2); border: 1px solid var(--border);
  color: var(--text); font-size: 15px; line-height: 1;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.modal-close:hover { background: #402c2c; border-color: var(--danger); color: var(--danger); }

</style>
</head>
<body>
  <div id="app">

    <!-- 顶部信息栏 -->
    <div id="topbar">
      <div class="brand">🏰 帝国前线</div>
      <div id="turn-info" class="top-item">回合 1</div>
      <div id="nation-info" class="top-item">—</div>
      <div id="treasury" class="top-item">💰 0</div>
      <div id="era-info" class="top-item">科技 —</div>
      <div class="top-spacer"></div>
      <button id="btn-toggle-sidebar" class="btn small top-btn" title="收起/展开左侧面板">◀ 面板</button>
      <button id="btn-toggle-event" class="btn small top-btn" title="收起/展开事件日志">日志 ▶</button>
      <button id="btn-diplomacy" class="btn small top-btn">外交</button>
      <button id="btn-save" class="btn small top-btn">存档</button>
      <button id="btn-sound" class="btn small top-btn">🔊</button>
      <button id="btn-achievements" class="btn small top-btn" title="成就">🏆</button>
      <button id="btn-menu" class="btn small top-btn">菜单</button>
    </div>

    <!-- 中部：侧栏 / 地图 / 事件 -->
    <div id="main">
      <div id="sidebar">
        <div id="tile-panel"></div>
      </div>
      <div id="canvas-wrap">
        <canvas id="game-canvas"></canvas>
        <div id="phase-banner"></div>
      </div>
      <div id="event-panel">
        <div class="panel-title">📜 事件日志</div>
        <div id="event-list"></div>
      </div>
    </div>

    <!-- 底部栏 -->
    <div id="bottombar">
      <button id="btn-endturn" class="btn primary">结束回合 <kbd>E</kbd></button>
      <span id="hint"></span>
    </div>

    <div id="toast"></div>

    <!-- 教程面板 -->
    <div id="tutorial-panel" class="hidden">
      <div id="tutorial-text"></div>
      <div class="tutorial-btns">
        <button id="btn-tut-next" class="btn primary">下一步 ▶</button>
        <button id="btn-tut-skip" class="btn">跳过教程</button>
      </div>
    </div>
  </div>

  <!-- 开始 / 暂停菜单 -->
  <div id="menu-overlay" class="overlay hidden">
    <div class="modal">
      <h1>🏰 帝国前线</h1>
      <p class="sub">随机苍澜大陆 · 回合制领土征服策略游戏</p>
      <button id="btn-continue" class="btn primary big" style="display:none">▶ 继续游戏</button>
      <div class="menu-form">
        <div class="form-row">
          <label>选择国家</label>
          <span class="dim">（共 <span id="nation-count">32</span> 个可玩国家）</span>
        </div>
        <div id="nation-picker"></div>
        <div class="form-row">
          <label>剧本</label>
          <select id="scenario"></select>
        </div>
        <div class="form-row">
          <label>难度</label>
          <select id="difficulty"></select>
        </div>
        <div class="form-row">
          <label>回合上限</label>
          <input type="number" id="turn-cap" min="0" step="10" value="120">
          <span class="dim">（0 = 无上限）</span>
        </div>
        <button id="btn-start" class="btn primary big">⚔️ 开始新游戏</button>
        <button id="btn-tutorial" class="btn big">🎓 新手教程（引导式）</button>
      </div>
      <div class="section-title">读取存档</div>
      <div id="menu-save-slots"></div>
      <p class="dim foot">滚轮缩放地图 · 拖拽平移 · 点击选中/移动 · E 结束回合 · D 外交 · Esc 取消调派</p>
    </div>
  </div>

  <!-- 科技树界面 -->
  <div id="tech-overlay" class="overlay hidden">
    <div class="modal wide tech-modal">
      <button id="btn-close-tech" class="modal-close" title="关闭科技树">✕</button>
      <h2>🔬 科技树 <span class="dim" style="font-size:12px;font-weight:400">（按住空白处拖拽平移 · 每条线一行）</span></h2>
      <div id="tech-viewport">
        <div id="tech-canvas"></div>
      </div>
    </div>
  </div>

  <!-- 政策界面 -->
  <div id="policy-overlay" class="overlay hidden">
    <div class="modal wide">
      <button id="btn-close-policy" class="modal-close" title="关闭政策">✕</button>
      <h2>📜 国家政策</h2>
      <p class="dim">一次性研究解锁，长期生效；部分政策有利也有弊。</p>
      <div class="policy-grid" id="policy-body"></div>
    </div>
  </div>

  <!-- 成就界面 -->
  <div id="achievements-overlay" class="overlay hidden">
    <div class="modal wide">
      <button id="btn-close-achievements" class="modal-close" title="关闭成就">✕</button>
      <h2>🏆 成就</h2>
      <p class="dim">成就解锁后永久保存。</p>
      <div class="ach-grid" id="achievements-body"></div>
    </div>
  </div>

  <!-- 外交界面 -->
  <div id="diplomacy-overlay" class="overlay hidden">
    <div class="modal wide">

  if (r >= 61) return '🛡️';
  if (r >= 31) return '⚔️';

}

  return 0.8 + Math.max(0, Math.min(100, r || 100)) / 100 * 0.4;
}

    const frontier = [{ q: cap.q, r: cap.r }];
    const visited = new Set([tileKey(cap.q, cap.r)]);
    let collected = 1;
    while (collected < perNation && frontier.length) {
      const cur = frontier.shift();
      for (let d = 0; d < 6; d++) {
        const nb = hexNeighbor(cur.q, cur.r, d);
        const k = tileKey(nb.q, nb.r);
        if (visited.has(k) || !inBounds(nb.q, nb.r)) continue;
        visited.add(k);
        const t = map.tiles[idx(nb.q, nb.r)];
        if (t.terrainId === 'SEA' || t.owner !== -1) continue;
        t.owner = n;
        t.pop = 1 + Math.floor(rand() * 2);
        collected++;
        frontier.push(nb);
        if (collected >= perNation) break;   // 单个格子也可能收满，须立即停止
      }
    }
    // 首都初始守军（士兵队，兵力零整不一，不超过 1000）
    for (let i = 0; i < (ECONOMY.startArmy || 2); i++) {
      startTile.army.push({ type: 'swordsman', soldiers: 100 + Math.floor(rand() * 900) });
    }
  }
}

// 顶层构建：生成地图 + 划海区 + 分配国家首都与领土
// 返回 { width, height, seed, tiles, landCells }
function buildHexMap(seed, nationCount, width, height, skipNation) {
  const map = generateHexMap(width || MAP_WIDTH, height || MAP_HEIGHT, seed);
  assignSeaZones(map);
  const capitals = placeCapitals(map.landCells, nationCount, seed);
  assignStartTiles(map, capitals, nationCount, skipNation >= 0 ? skipNation : -1);
  return map;
}

// nation.js — 国家：人口经济、科技树、建筑、政策、领导人加成（v3 六边形版）
'use strict';

const TECH_TRACK_NAMES = { melee: '近战', ranged: '远程', artillery: '炮兵', navy: '海军', air: '空军', economy: '经济', culture: '文化', education: '教育' };
// 军事总等级 = 各战斗子线最高等级（供建筑等以"军事等级"统一判断）
function nationMilitaryLevel(nation) {
  return Math.max(nation.tech.melee || 0, nation.tech.ranged || 0, nation.tech.artillery || 0);
}

// 国家全局加成汇总（政策 + 领导人）。乘法键返回倍率；trade 返回每协定的金币加值。
function nationMod(nation, key) {
  if (!nation) return 1;
  let mult = 1;
  const P = nation.policies || {};
  const lvl = k => (+P[k] || 0);   // 政策等级（0~3；旧档布尔 true 视为 1）
  switch (key) {
    case 'income':      break; // 收入倍率：主要来自领导人
    case 'tax':         if (lvl('landReform')) mult *= (1 + lvl('landReform') * 0.0333); break;
    case 'upkeep':      if (lvl('standingArmy')) mult *= (1 - lvl('standingArmy') * 0.10); if (lvl('warMachine')) mult *= (1 + lvl('warMachine') * 0.10); break;
    case 'recruitCost': if (lvl('conscription')) mult *= (1 - lvl('conscription') * 0.0667); break;
    case 'buildCost':   if (lvl('centralize')) mult *= (1 - lvl('centralize') * 0.0667); break;
    case 'attack':      if (lvl('warMachine')) mult *= (1 + lvl('warMachine') * 0.05); break;
    case 'navyAtk':     if (lvl('exploration')) mult *= (1 + lvl('exploration') * 0.0667); break;
    case 'popGrowth':   if (lvl('landReform')) mult *= (1 + lvl('landReform') * 0.10); break;
    case 'defense':     if (lvl('frontierDef')) mult *= (1 + lvl('frontierDef') * 0.0833); break;
    case 'techSpeed':   break; // 科技投入效率：主要来自领导人
    case 'trade': {
      let add = 0;
      if (lvl('tradeRoutes')) add += lvl('tradeRoutes') * 5;
      return add;
    }
  }
  const L = nation.leader;
  if (L && L.apply === key) mult *= L.value;
  return mult;
}

// 实施/升级一项政策（3 级程度点，每级增益更多）
function enactPolicy(game, nation, policyId) {
  const pol = POLICIES[policyId];
  if (!pol) return { ok: false, msg: '未知政策' };
  const max = pol.max || 1;
  const lvl = (nation.policies && nation.policies[policyId]) || 0;
  if (lvl >= max) return { ok: false, msg: '该政策已满级（' + max + '/' + max + '）' };
  if (nation.treasury < pol.cost) return { ok: false, msg: '金币不足' };
  nation.treasury -= pol.cost;
  nation.policies[policyId] = lvl + 1;
  addEvent(game, '📜 ' + nation.name + ' 升级政策「' + pol.name + '」至 Lv' + (lvl + 1) + '/' + max);
  return { ok: true, msg: pol.name + ' 提升至 Lv' + (lvl + 1) + '/' + max };
}

// 单省每回合收入（地皮税制：每块基础产出 + 建筑加成 + 首都/副首都加成，人口不再直接产金）
function provinceIncome(game, prov) {
  let gold = ECONOMY.baseTileGold;
  if (prov.building) gold += BUILDINGS[prov.building].gold;
  if (prov.city) gold += ECONOMY.cityGoldBonus;                       // 城市额外产出
  if (prov.capital) gold += ECONOMY.capitalGoldBonus;
  if (prov.secondaryCapital) gold += ECONOMY.secondaryCapitalGold;   // 副首都额外产出
  const nation = prov.owner === -1 ? null : game.nations[prov.owner];
  if (nation && nation.tech && nation.tech.economy >= 3) gold *= (1 + ECONOMY.ecoLevel3Bonus);
  if (nation && nation.tech && nation.tech.economy >= 4) gold *= (1 + ECONOMY.ecoLevel4Bonus);
  return gold;
}

// 国家每回合经济
function nationIncome(game, nation) {
  let gold = 0, upkeep = 0, pop = 0, units = 0, soldiers = 0;
  for (const prov of game.map.provinces) {
    if (prov.owner !== nation.id) continue;
    gold += provinceIncome(game, prov);
    pop += prov.pop;
    units += prov.army.length;
    soldiers += nationSoldiers(prov);
  }
  gold += nation.trades.length * (ECONOMY.tradeGold + nationMod(nation, 'trade'));
  let mult = 1;
  if (!nation.isPlayer) mult = DIFFICULTIES[game.settings.difficulty].aiIncomeMult;
  gold *= mult * nationMod(nation, 'income') * nationMod(nation, 'tax');
  upkeep = units * ECONOMY.upkeepPerUnit * nationMod(nation, 'upkeep');

  nation.goldIncome = Math.round(gold);
  nation.upkeep = Math.round(upkeep);
  nation.population = Math.round(pop);
  nation.units = units;
  nation.soldiers = soldiers;
  nation.recruitable = Math.floor(pop * 0.15);   // 可招募人口（约人口 15%）
  return { gold: nation.goldIncome, upkeep };
}

// 每回合结算：收入-维护 + 人口增长
function applyEconomy(game, nation) {
  const { gold, upkeep } = nationIncome(game, nation);
  nation.treasury = Math.max(0, nation.treasury + gold - upkeep);
  const pgMult = nationMod(nation, 'popGrowth');
  for (const prov of game.map.provinces) {
    if (prov.owner !== nation.id) continue;
    let rate = ECONOMY.popGrowthBase * pgMult;
    if (prov.city) rate += ECONOMY.cityGrowth;
    if (prov.building && BUILDINGS[prov.building].pop) rate += BUILDINGS[prov.building].pop;
    prov.pop += prov.pop * rate;
  }
  // 研究滑条：每回合按设定投入（钢铁雄心4式研究分配）
  if (nation.techInvest) {
    for (const track of Object.keys(TECH_TREE)) {
      const amt = Math.min(nation.techInvest[track] || 0, nation.treasury);
      if (amt > 0) investTech(game, nation, track, amt);
    }
  }
  // 大学：每回合自动投入少量金币研究科技（优先经济，其次海军（若已开启），否则近战）
  if (game.map.provinces.some(p => p.owner === nation.id && p.building === 'university')) {
    let track = 'economy';
    if (nation.tech.economy >= 2 && !nation.atWar.length && nation.tech.navy < 2 && !techOpenUnmet(nation, 'navy')) track = 'navy';
    else if (nation.tech.economy >= 3) track = 'melee';
    investTech(game, nation, track, Math.min(10, nation.treasury));
  }
}

// 建造建筑
function buildBuilding(game, nation, prov, buildingId) {
  if (prov.owner !== nation.id) return { ok: false, msg: '不是你的领土' };
  const b = BUILDINGS[buildingId];
  if (!b) return { ok: false, msg: '未知建筑' };
  if (b.mil > nationMilitaryLevel(nation)) return { ok: false, msg: '需军事科技（任一陆战线达 ' + b.mil + ' 级）' };
  if (b.eco > nation.tech.economy) return { ok: false, msg: '需经济科技「' + TECH_TREE.economy[b.eco].name + '」' };
  if (prov.building) return { ok: false, msg: '已有建筑' };
  if (b.naval && !isCoastal(prov)) return { ok: false, msg: '港口需要沿海省份' };
  const cost = Math.round(b.cost * nationMod(nation, 'buildCost'));
  if (nation.treasury < cost) return { ok: false, msg: '金币不足' };
  nation.treasury -= cost;
  prov.building = buildingId;
  nation.buildCount = (nation.buildCount || 0) + 1;   // 成就：累计建造
  return { ok: true, msg: '建造完成' };
}

// 投资科技（三线之一）
function investTech(game, nation, track, amount) {
  const levels = TECH_TREE[track];
  const cur = nation.tech[track];
  const next = levels[cur + 1];
  if (!next) return { upgraded: false, msg: '该科技线已至顶级' };
  // 线开启前提检查（非近战/经济线需先研究其开启前置）
  const openUnmet = techOpenUnmet(nation, track);
  if (openUnmet) {
    const nm = TECH_TRACK_NAMES[openUnmet.t] + '·' + (TECH_TREE[openUnmet.t] && TECH_TREE[openUnmet.t][openUnmet.l] ? TECH_TREE[openUnmet.t][openUnmet.l].name : openUnmet.l);
    return { upgraded: false, msg: '⚠️ 需先开启「' + TECH_TRACK_NAMES[track] + '」线：研究「' + nm + '」', prereq: [openUnmet] };
  }
  // 节点前置条件检查：未满足则提示所需前置，并附带 prereq 供界面跳转
  const unmet = (next.req || []).filter(r => (nation.tech[r.t] || 0) < r.l);
  if (unmet.length) {
    const names = unmet.map(r => TECH_TRACK_NAMES[r.t] + '·' + (TECH_TREE[r.t] && TECH_TREE[r.t][r.l] ? TECH_TREE[r.t][r.l].name : r.l)).join('、');
    return { upgraded: false, msg: '⚠️ 前置未满足：需先研究「' + names + '」', prereq: unmet };
  }
  const invest = Math.min(amount, nation.treasury);
  if (invest <= 0) return { upgraded: false, msg: '金币不足' };
  nation.treasury -= invest;
  nation.techProgress[track] += Math.round(invest * nationMod(nation, 'techSpeed'));
  if (nation.techProgress[track] >= next.cost) {
    nation.techProgress[track] -= next.cost;
    nation.tech[track]++;
    return { upgraded: true, msg: '解锁「' + next.name + '」（' + TECH_TRACK_NAMES[track] + '）' };
  }
  return { upgraded: false, msg: TECH_TRACK_NAMES[track] + '科技投入 +' + invest };
}

// 某科技线的开启前提是否未满足（返回未满足的前置或 null）
function techOpenUnmet(nation, track) {
  const o = TECH_OPEN[track];
  if (!o) return null;
  return (nation.tech[o.t] || 0) >= o.l ? null : o;
}

// 某科技线的"下一个可研究节点"前置是否已满足（含线开启前提，供 AI/界面判断）
function techNextOpenable(nation, track) {
  if (techOpenUnmet(nation, track)) return false;
  const levels = TECH_TREE[track];
  const next = levels[(nation.tech[track] || 0) + 1];
  if (!next) return false;
  return !(next.req || []).some(r => (nation.tech[r.t] || 0) < r.l);
}

// 国家已解锁的单位（土著军不可招募）；按各自科技子线解锁，且该线须已开启
function unlockedUnits(nation) {
  return Object.values(UNIT_TYPES).filter(u => {
    if (u.native || !u.req) return false;
    if (techOpenUnmet(nation, u.req.t)) return false;
    return (nation.tech[u.req.t] || 0) >= u.req.l;
  });
}

// 国家总实力
function nationPower(game, nation) {
  const tiles = nationTerritoryCount(game, nation);
  return {
    tiles,
    units: nation.units || 0,
    treasury: nation.treasury,
    score: (nation.units || 0) * 2 + tiles * 3 + Math.floor(nation.treasury / 10),
  };
}

function nationTerritoryCount(game, nation) {
  let c = 0;
  for (const prov of game.map.provinces) if (prov.owner === nation.id) c++;
  return c;
}

function checkNationAlive(game, nation) {
  if (!nation.alive) return false;
  if (nationTerritoryCount(game, nation) <= 0) {
    nation.alive = false;
    nation.atWar = [];
    return false;
  }
  return true;
}

function nationArmyProvinces(game, nation) {
  const list = [];
  for (const prov of game.map.provinces) {
    if (prov.owner === nation.id && prov.army.length > 0) list.push(prov);
  }
  return list;
}

function nationCapitalProvince(game, nation) {
  for (const prov of game.map.provinces) {
    if (prov.owner === nation.id && prov.capital) return prov;
  }
  return null;
}

  <script>
// military.js — 单位、军队、移动（陆地邻接 + 海运）、战斗（v2 省份版）
'use strict';

// 招募单位到指定省
function recruitUnit(game, nation, prov, unitId) {
  const u = UNIT_TYPES[unitId];
  if (!u) return { ok: false, msg: '未知单位' };
  if (prov.owner !== nation.id) return { ok: false, msg: '不是你的领土' };
  if (u.naval && !isCoastal(prov)) return { ok: false, msg: '战船需在沿海省份建造' };
  if (u.req && (nation.tech[u.req.t] || 0) < u.req.l) {
    const nm = (TECH_TREE[u.req.t] && TECH_TREE[u.req.t][u.req.l]) ? TECH_TREE[u.req.t][u.req.l].name : '更高级';
    return { ok: false, msg: '需科技「' + TECH_TRACK_NAMES[u.req.t] + '·' + nm + '」' };
  }
  let cost = u.cost;
  if (!nation.isPlayer) cost *= DIFFICULTIES[game.settings.difficulty].aiRecruitCostMult;
  cost = Math.round(cost * nationMod(nation, 'recruitCost'));
  if (prov.building === 'arsenal') cost = Math.round(cost * 0.85);   // 兵工厂打折
  if (nation.treasury < cost) return { ok: false, msg: '金币不足' };
  nation.treasury -= cost;
  prov.army.push({ type: unitId, soldiers: u.soldiers });   // 招募一支士兵队
  return { ok: true, msg: '征募 ' + u.name + '（' + u.soldiers + ' 士兵）' };
}

// 军队移动点数（取队内最慢单位）
function armyMovePoints(prov) {
  let mp = 99;
  for (const u of prov.army) {
    const m = UNIT_TYPES[u.type].move;
    if (m < mp) mp = m;
  }
  return mp > 0 ? mp : 1;
}

function hasNavy(prov) {
  return prov.army.some(u => UNIT_TYPES[u.type].naval);
}

function sameSea(a, b) {
  return isCoastal(a) && isCoastal(b) && a.sea === b.sea;
}

// 尝试 from -> to 移动/海运/进攻。返回 { ok, msg, combat? }
function tryAdvance(game, nation, fromProv, toProv) {
  if (fromProv.owner !== nation.id || fromProv.army.length === 0) return { ok: false, msg: '无军队可动' };
  const mp = fromProv.movesRemaining || 0;
  const isLandNeighbor = fromProv.neighbors.includes(toProv.id);

  // ---- 海运（非同陆邻，需同海区 + 队内有战船） ----
  if (!isLandNeighbor) {
    if (!sameSea(fromProv, toProv)) return { ok: false, msg: '不可到达：既不相邻也无共用海区' };
    if (!hasNavy(fromProv)) return { ok: false, msg: '跨海需队内有战船' };
    if (mp < 1) return { ok: false, msg: '移动力不足' };
    if (toProv.owner !== -1 && toProv.owner !== nation.id) {
      const defenderId = toProv.owner;
      if (!isAtWar(game, nation.id, defenderId)) declareWar(game, nation.id, defenderId);
      const wasCapital = toProv.capital;
      const res = resolveCombat(game, fromProv, toProv);
      if (!res) return { ok: false, msg: '登陆失败' };
      fromProv.movesRemaining = 0;
      if (res.win && wasCapital) handleCapitalFall(game, nation, toProv, defenderId);
      if (res.win && game) { game._conqueredCount = (game._conqueredCount || 0) + 1; checkAchievements(game); }
      return { ok: true, msg: res.msg, combat: res };
    }
    if (toProv.owner === -1 && toProv.army.length > 0) {
      // 土著政权：需战斗击败
      const res = resolveCombat(game, fromProv, toProv);
      if (!res) return { ok: false, msg: '登陆失败' };
      fromProv.movesRemaining = 0;
      if (res.win && game) { game._conqueredCount = (game._conqueredCount || 0) + 1; checkAchievements(game); }
      return { ok: true, msg: res.msg };
    }
    if (toProv.owner === -1) {
      toProv.garrisonOwner = nation.id;   // 只驻军，不设政治主权（需殖民）
    }
    const kept = fromProv.army;
    toProv.army = toProv.army.concat(kept);
    fromProv.army = [];
    fromProv.movesRemaining = 0;
    toProv.movesRemaining = 0;
    return { ok: true, msg: '⛵ 海运抵达 ' + toProv.name };
  }

  // ---- 陆地邻接移动 ----
  const cost = TERRAINS[toProv.terrain].moveCost;
  if (mp < cost) return { ok: false, msg: '移动力不足' };

  // 敌占省
  if (toProv.owner !== -1 && toProv.owner !== nation.id) {
    const defenderId = toProv.owner;
    if (!isAtWar(game, nation.id, defenderId)) declareWar(game, nation.id, defenderId);
    if (toProv.army.length === 0) {
      const wasCapital = toProv.capital;
      toProv.army = fromProv.army;
      fromProv.army = [];
      toProv.owner = nation.id;
      fromProv.movesRemaining = 0;
      toProv.movesRemaining = 0;
      addEvent(game, '🚩 ' + game.nations[nation.id].name + ' 兵不血刃占领敌省');
      if (wasCapital) handleCapitalFall(game, nation, toProv, defenderId);
      if (game) { game._conqueredCount = (game._conqueredCount || 0) + 1; checkAchievements(game); }
      return { ok: true, msg: '兵不血刃，占领成功' };
    }
    const wasCapital = toProv.capital;
    const res = resolveCombat(game, fromProv, toProv);
    if (!res) return { ok: false, msg: '进攻失败' };
    fromProv.movesRemaining = 0;
    if (res.win && wasCapital) handleCapitalFall(game, nation, toProv, defenderId);
    if (res.win && game) { game._conqueredCount = (game._conqueredCount || 0) + 1; checkAchievements(game); }
    return { ok: true, msg: res.msg, combat: res };
  }

  // 空地（无政权或土著） / 友方省 → 移动
  if (toProv.owner === -1 && toProv.army.length > 0) {
    // 土著政权：需战斗击败，打退后仍为无主地（可殖民）
    const res = resolveCombat(game, fromProv, toProv);
    if (!res) return { ok: false, msg: '进攻失败' };
    fromProv.movesRemaining = 0;
    if (res.win && game) { game._conqueredCount = (game._conqueredCount || 0) + 1; checkAchievements(game); }
    return { ok: true, msg: res.msg };
  }
  if (toProv.owner === -1) {
    toProv.garrisonOwner = nation.id;   // 只驻军，不设政治主权（需殖民）
  }
  const kept = fromProv.army;
  toProv.army = toProv.army.concat(kept);
  fromProv.army = [];
  fromProv.movesRemaining = 0;
  toProv.movesRemaining = mp - cost;
  return { ok: true, msg: '移动完成' };
}

// 一省军队的总士兵数 / 政权军人 / 土著军人
function totalSoldiers(prov) { let n = 0; for (const u of prov.army) n += u.soldiers || 0; return n; }
function nationSoldiers(prov) { let n = 0; for (const u of prov.army) if (!(UNIT_TYPES[u.type] && UNIT_TYPES[u.type].native)) n += u.soldiers || 0; return n; }
function nativeSoldiers(prov) { let n = 0; for (const u of prov.army) if (UNIT_TYPES[u.type] && UNIT_TYPES[u.type].native) n += u.soldiers || 0; return n; }

// 战斗推演（士兵数计战力，地形按兵种增益/减益）
function resolveCombat(game, fromProv, toProv) {
  const atkUnits = fromProv.army, defUnits = toProv.army;
  if (!defUnits.length) return null;

  const atkNation = game.nations[fromProv.owner];
  const defNation = game.nations[toProv.owner];
  const terrainId = toProv.terrain;   // 战场地形 = 防守方所在格

  let atk = 0;
  for (const u of atkUnits) {
    const ut = UNIT_TYPES[u.type];
    let a = ut.atk * (u.soldiers / ut.soldiers) * terrainMod(ut, terrainId);
    if (ut.naval) a *= nationMod(atkNation, 'navyAtk');
    else if (ut.id === 'cavalry' || ut.id === 'heavycav') a *= nationMod(atkNation, 'cav');
    atk += a;
  }
  atk *= nationMod(atkNation, 'attack');
  let def = 0;
  for (const u of defUnits) {
    const ut = UNIT_TYPES[u.type];
    def += ut.def * (u.soldiers / ut.soldiers) * terrainMod(ut, terrainId);
  }

  const terrain = TERRAINS[terrainId];
  let defMult = 1 + terrain.defBonus;
  defMult *= nationMod(defNation, 'defense');
  defMult *= moraleMultiplier(defNation ? defNation.resistance : 100);   // 抵抗度 → 士气 → 防守
  const hasSiege = atkUnits.some(u => UNIT_TYPES[u.type].siege);
  if (toProv.city) defMult += hasSiege ? COMBAT.cityDefBonus * COMBAT.siegeReduces : COMBAT.cityDefBonus;
  if (toProv.building === 'fort') defMult += COMBAT.fortDefBonus;

  const rollA = atk * (1 - COMBAT.atkJitter + Math.random() * 2 * COMBAT.atkJitter);
  const rollD = def * defMult * (1 - COMBAT.defJitter + Math.random() * 2 * COMBAT.defJitter);

  if (rollA > rollD) {
    // 守方按战损削减；进攻方即使获胜也有可观损耗 → 突出防守优势
    const lossRatio = clamp((rollA - rollD) / rollA, COMBAT.attackerMinLoss * 0.6, COMBAT.maxLossRatio);
    const defLoss = applyLosses(toProv, lossRatio);
    const myLoss = COMBAT.attackerMinLoss + Math.random() * 0.12;
    const atkLoss = applyLosses(fromProv, myLoss);

    const city = toProv.city, building = toProv.building;
    toProv.army = fromProv.army;
    fromProv.army = [];
    toProv.owner = defNation ? atkNation.id : -1;        // 土著(owner -1)击败后仍为无主地，需殖民
    toProv.garrisonOwner = defNation ? null : atkNation.id;
    toProv.city = city;
    toProv.capital = false;
    toProv.building = building;
    toProv.movesRemaining = 0;
    addEvent(game, '⚔️ ' + atkNation.name + ' 攻占了 ' + (defNation ? defNation.name + ' 的领地' : '土著之地'));
    return { win: true, msg: '攻占 ' + toProv.name + '！守方伤亡 ' + defLoss + '，我方伤亡 ' + atkLoss };
  } else {
    const lossRatio = clamp((rollD - rollA) / rollD + 0.35, 0.5, 0.95);
    const atkLoss = applyLosses(fromProv, lossRatio);
    const dLoss = applyLosses(toProv, COMBAT.defenderWinLoss + Math.random() * 0.08);
    return { win: false, msg: '进攻被击退，我方伤亡 ' + atkLoss + '，守方伤亡 ' + dLoss };
  }
}

// 按比例削减士兵数，返回伤亡士兵数
function applyLosses(prov, ratio) {
  if (!prov.army.length) return 0;
  let lost = 0;
  for (const u of prov.army) {
    const before = u.soldiers || 0;
    u.soldiers = Math.max(0, Math.floor(before * (1 - ratio)));
    lost += before - u.soldiers;
  }
  prov.army = prov.army.filter(u => u.soldiers > 0);
  return lost;
}

// 省份实际归属者（政治主权或驻军者；无主且无驻军则为 -1）
function provOwnerId(prov) {
  if (prov.owner !== -1) return prov.owner;
  return (prov.garrisonOwner !== null && prov.garrisonOwner !== undefined) ? prov.garrisonOwner : -1;
}

// 军队拆分：把 from 的 count 名士兵派往相邻格 to（己方或无主驻军格）
function splitArmy(game, nation, fromProv, toProv, count) {
  if (provOwnerId(fromProv) !== nation.id) return { ok: false, msg: '不是你的军队' };
  const avail = totalSoldiers(fromProv);
  if (avail <= 0) return { ok: false, msg: '无军队可派' };
  if (!fromProv.neighbors.includes(toProv.id)) return { ok: false, msg: '只能派往相邻省份' };
  if (fromProv.movesRemaining < 1) return { ok: false, msg: '移动力不足' };
  const c = Math.floor(count);
  if (!(c >= 1) || c > avail) return { ok: false, msg: '派遣数量无效（1~' + avail + '）' };
  const toOwner = provOwnerId(toProv);
  if (toOwner !== nation.id && toProv.army.length > 0) return { ok: false, msg: '目标有敌军，需进攻' };
  // 从 from 末尾士兵队开始剥离 c 名
  let remaining = c;
  const moved = [];
  while (remaining > 0 && fromProv.army.length) {
    const last = fromProv.army[fromProv.army.length - 1];
    const take = Math.min(remaining, last.soldiers);
    if (take >= last.soldiers) {
      moved.push({ type: last.type, soldiers: last.soldiers });
      fromProv.army.pop();
    } else {
      last.soldiers -= take;
      moved.push({ type: last.type, soldiers: take });
    }
    remaining -= take;
  }
  if (moved.length) {
    for (const m of moved) toProv.army.push(m);
    if (toProv.owner === -1) toProv.garrisonOwner = nation.id;   // 派往无主地 → 驻军，待殖民
    fromProv.movesRemaining = 0;
    toProv.movesRemaining = Math.max(0, armyMovePoints(toProv) - TERRAINS[toProv.terrain].moveCost);
    return { ok: true, msg: '派遣 ' + c + ' 名士兵' };
  }
  return { ok: false, msg: '派遣失败' };
}

// 每回合重置移动点（领导人的"移动力 +1"生效；驻军格按其驻军归属者结算）
function resetArmyMoves(game) {
  for (const prov of game.map.provinces) {
    if (!prov.army.length) { prov.movesRemaining = 0; continue; }
    const ownerId = provOwnerId(prov);
    if (ownerId === -1) { prov.movesRemaining = 0; continue; }
    let mp = armyMovePoints(prov);
    const nation = game.nations[ownerId];
    if (nation && nation.leader && nation.leader.apply === 'move') mp += 1;
    prov.movesRemaining = mp;
  }
}

// 按兵种汇总士兵数（仅政权军人，不含土著军）
function stackSummary(prov) {
  const summary = {};
  for (const u of prov.army) {
    if (UNIT_TYPES[u.type] && UNIT_TYPES[u.type].native) continue;
    summary[u.type] = (summary[u.type] || 0) + (u.soldiers || 0);
  }
  return summary;
}

// 土著军士兵数
function nativeCount(prov) {
  let n = 0;
  for (const u of prov.army) if (UNIT_TYPES[u.type] && UNIT_TYPES[u.type].native) n += u.soldiers || 0;
  return n;
}

// diplomacy.js — 外交关系与动作
'use strict';

function getNationById(game, id) { return game.nations[id]; }

// 外交天才型领导人的接受加成
function dipAcceptBonus(nation) {
  return (nation && nation.leader && nation.leader.apply === 'diplomacy') ? 0.2 : 0;
}

// 国际信誉对外交接受度的加成：高信誉更被信任
function credDiploBonus(nation) {
  const c = (nation && nation.credibility !== undefined) ? nation.credibility : 50;
  return (c - 50) * 0.004;
}

function relationBetween(game, aId, bId) {
  const a = game.nations[aId];
  if (!a || !a.relations[bId] && a.relations[bId] !== 0) return 0;
  return a.relations[bId] || 0;
}

function isAtWar(game, aId, bId) {
  const a = game.nations[aId];
  return a && a.atWar.includes(bId);
}

function isAllied(game, aId, bId) {
  const a = game.nations[aId];
  return a && a.allies.includes(bId);
}

function hasTrade(game, aId, bId) {
  const a = game.nations[aId];
  return a && a.trades.includes(bId);
}

function adjustRelation(game, aId, bId, delta) {
  const a = game.nations[aId], b = game.nations[bId];
  if (!a || !b) return;
  a.relations[bId] = clamp((a.relations[bId] || 0) + delta, -100, 100);
  b.relations[aId] = clamp((b.relations[aId] || 0) + delta, -100, 100);
}

// 双方军事强度对比，用于 AI 判断
function powerRatio(game, aId, bId) {
  const a = nationPower(game, game.nations[aId]);
  const b = nationPower(game, game.nations[bId]);
  const sa = a.score + 1, sb = b.score + 1;
  return sa / (sa + sb); // a 相对强度 0..1
}

// ---------- 外交动作 ----------

// 宣战（单边即生效）
function declareWar(game, aId, bId) {
  const a = game.nations[aId], b = game.nations[bId];
  if (!a.alive || !b.alive) return { ok: false, msg: '对方已覆灭' };
  if (isAtWar(game, aId, bId)) return { ok: false, msg: '已处于战争状态' };
  const wasAlly = isAllied(game, aId, bId);
  const wasTrade = hasTrade(game, aId, bId);
  a.atWar.push(bId);
  b.atWar.push(aId);
  if (a.isPlayer && game) game._playerDeclared = true;   // 成就：玩家主动宣战过
  if (wasAlly) {
    a.allies = a.allies.filter(x => x !== bId);
    b.allies = b.allies.filter(x => x !== aId);
  }
  if (wasTrade) {
    a.trades = a.trades.filter(x => x !== bId);
    b.trades = b.trades.filter(x => x !== aId);
  }
  adjustRelation(game, aId, bId, -50);
  // 国际信誉：背盟/毁约大幅失信，无故宣战也损信誉
  let credLoss = 5;
  if (wasAlly) credLoss = 30;
  else if (wasTrade) credLoss = 15;
  a.credibility = clamp((a.credibility === undefined ? 50 : a.credibility) - credLoss, 0, 100);
  addEvent(game, '⚔️ ' + a.name + ' 向 ' + b.name + ' 宣战！' + (credLoss > 5 ? '（背信弃义，信誉 -' + credLoss + '）' : ''));
  return { ok: true, msg: '已宣战' };
}

// 议和（需对方同意，基于战争态势与关系）
function proposePeace(game, aId, bId) {
  const a = game.nations[aId], b = game.nations[bId];
  if (!isAtWar(game, aId, bId)) return { ok: false, msg: '并未处于战争状态' };

  // AI 是否同意
  const rel = (a.relations[bId] || 0);
  const ratio = powerRatio(game, aId, bId);
  let chance = 0.25 + ratio * 0.4 + Math.max(0, rel) * 0.004 + 0.1;
  chance = clamp(chance, 0.15, 0.9);
  const accepted = b.isPlayer || Math.random() < (chance + dipAcceptBonus(a) + credDiploBonus(a));

  if (accepted) {
    a.atWar = a.atWar.filter(x => x !== bId);
    b.atWar = b.atWar.filter(x => x !== aId);
    adjustRelation(game, aId, bId, 20);
    addEvent(game, '🕊️ ' + a.name + ' 与 ' + b.name + ' 达成和平');
    return { ok: true, msg: '和平达成' };
  }
  adjustRelation(game, aId, bId, -2);
  const reason = rel < -20 ? '对方在战场上占据优势，无意议和' : '对我的和平诚意存疑';
  return { ok: false, msg: b.name + ' 拒绝了议和：' + reason };
}

// 结盟
function proposeAlliance(game, aId, bId) {
  const a = game.nations[aId], b = game.nations[bId];
  if (isAllied(game, aId, bId)) return { ok: false, msg: '已是盟友' };
  if (isAtWar(game, aId, bId)) return { ok: false, msg: '战争状态下无法结盟' };
  const rel = (b.relations[aId] || 0);
  const accepted = b.isPlayer ? true : rel >= 50 && Math.random() < (0.7 + dipAcceptBonus(a) + credDiploBonus(a));
  if (!accepted) {
    const reason = rel < 50
      ? '友好度不足（当前 ' + rel + '，需 ≥50）'
      : '对我方仍缺乏信任，婉拒结盟';
    return { ok: false, msg: b.name + ' 婉拒了结盟：' + reason };
  }
  a.allies.push(bId);
  b.allies.push(aId);
  adjustRelation(game, aId, bId, 15);
  addEvent(game, '🤝 ' + a.name + ' 与 ' + b.name + ' 结成同盟');
  return { ok: true, msg: '结盟成功' };
}

// 贸易协定
function proposeTrade(game, aId, bId) {
  const a = game.nations[aId], b = game.nations[bId];
  if (hasTrade(game, aId, bId)) return { ok: false, msg: '已有贸易协定' };
  if (isAtWar(game, aId, bId)) return { ok: false, msg: '战争状态下无法通商' };
  const rel = (b.relations[aId] || 0);
  const accepted = b.isPlayer ? true : rel >= 20 && Math.random() < (0.8 + dipAcceptBonus(a) + credDiploBonus(a));
  if (!accepted) {
    const reason = rel < 20
      ? '友好度不足（当前 ' + rel + '，需 ≥20）'
      : '对我方仍有戒心，暂时拒绝通商';
    return { ok: false, msg: b.name + ' 婉拒了通商：' + reason };
  }
  a.trades.push(bId);
  b.trades.push(aId);
  adjustRelation(game, aId, bId, 6);
  addEvent(game, '💰 ' + a.name + ' 与 ' + b.name + ' 建立贸易协定');
  return { ok: true, msg: '贸易协定生效' };
}

// 赠金
function offerGift(game, aId, bId, amount) {
  const a = game.nations[aId], b = game.nations[bId];
  amount = Math.min(Math.max(0, Math.floor(amount)), a.treasury);
  if (amount < 10) return { ok: false, msg: '赠金至少 10 金币' };
  a.treasury -= amount;
  b.treasury += amount;
  adjustRelation(game, aId, bId, Math.floor(amount / 10));
  addEvent(game, '🎁 ' + a.name + ' 向 ' + b.name + ' 赠送 ' + amount + ' 金币');
  return { ok: true, msg: '赠金已送达' };
}

// ai.js — AI 决策（v2 省份版）
'use strict';

// 两国是否有陆地相邻（含海运可达不考虑）
function areAdjacent(game, aId, bId) {
  for (const p of game.map.provinces) {
    if (p.owner !== aId) continue;
    for (const nid of p.neighbors) {
      if (game.map.provinces[nid].owner === bId) return true;
    }
  }
  return false;
}

function enemyProvincesOf(game, nation) {
  const list = [];
  for (const eid of nation.atWar) {
    const e = game.nations[eid];
    if (!e || !e.alive) continue;
    for (const p of game.map.provinces) if (p.owner === eid) list.push(p);
  }
  return list;
}

// 朝目标走一步（穿过己方/空地/交战方领土）
function stepToward(game, prov, target, nation) {
  let best = null, bestD = 1e9;
  for (const nid of prov.neighbors) {
    const p = game.map.provinces[nid];
    if (p.owner !== -1 && p.owner !== nation.id && !isAtWar(game, nation.id, p.owner)) continue;
    const d = approxDistance(p, target);
    if (d < bestD) { bestD = d; best = p; }
  }
  return best;
}

// 扩张目标：在己方省份内 BFS，找“紧邻空地”的边界省
function findExpansionTarget(game, nation, prov) {
  const queue = [prov];
  const visited = new Set([prov.id]);
  while (queue.length) {
    const cur = queue.shift();
    for (const nid of cur.neighbors) {
      const p = game.map.provinces[nid];
      if (p.owner === -1) return { from: cur, to: p };
    }
    for (const nid of cur.neighbors) {
      const p = game.map.provinces[nid];
      if (p.owner === nation.id && !visited.has(p.id)) { visited.add(p.id); queue.push(p); }
    }
  }
  return null;
}

// 殖民己方驻军的无主地（军队驻守 + 花费金币）
function aiColonize(game, nation) {
  let n = 0;
  for (const prov of game.map.provinces) {
    if (n >= 3) break;   // 每回合最多殖民 3 块
    if (prov.owner !== -1 || prov.garrisonOwner !== nation.id || !prov.army.length) continue;
    if (nation.treasury < ECONOMY.colonizeCost) continue;
    colonizeProvince(game, nation, prov);
    n++;
  }
}

function aiRecruit(game, nation) {
  const diff = DIFFICULTIES[game.settings.difficulty];
  const power = nationPower(game, nation);
  const want = Math.max(2, Math.floor(nationTerritoryCount(game, nation) / 2));
  if (power.units >= want + 2 || nation.treasury < 25) return;

  let bestProv = null;
  for (const p of game.map.provinces) {
    if (p.owner !== nation.id) continue;
    if (p.building === 'barracks' || p.capital) { bestProv = p; break; }
  }
  if (!bestProv) {
    for (const p of game.map.provinces) if (p.owner === nation.id) { bestProv = p; break; }
  }
  if (!bestProv) return;

  const avail = unlockedUnits(nation).filter(u => nation.treasury >= Math.round(u.cost * diff.aiRecruitCostMult));
  let pool = avail;
  if (!nation.atWar.length) pool = avail.filter(u => !u.siege);
  if (!pool.length) pool = avail;
  if (!pool.length) return;
  const best = pool.reduce((a, b) => a.atk * a.def >= b.atk * b.def ? a : b);
  recruitUnit(game, nation, bestProv, best.id);
}

function aiBuild(game, nation) {
  const appetite = DIFFICULTIES[game.settings.difficulty].aiAggression;
  if (Math.random() > appetite * 0.9) return;
  let built = 0;
  for (const p of game.map.provinces) {
    if (p.owner !== nation.id || built >= 2) continue;
    if (p.building) continue;
    // 首都优先要塞（战时）或兵营
    if (p.capital && nation.atWar.length && nation.treasury >= BUILDINGS.fort.cost) {
      buildBuilding(game, nation, p, 'fort'); built++; continue;
    }
    if (p.capital && nation.treasury >= BUILDINGS.barracks.cost) {
      buildBuilding(game, nation, p, 'barracks'); built++; continue;
    }
    // 沿海建港口（解锁海运）
    if (isCoastal(p) && nation.treasury >= BUILDINGS.port.cost) {
      buildBuilding(game, nation, p, 'port'); built++; continue;
    }
    // 平原/沙漠造矿山
    if ((p.terrain === 'PLAINS' || p.terrain === 'DESERT') && Math.random() < 0.6 && nation.treasury >= BUILDINGS.mine.cost) {
      buildBuilding(game, nation, p, 'mine'); built++; continue;
    }
  }
}

function aiTech(game, nation) {
  const invest = Math.min(ECONOMY.aiTechInvest, Math.max(0, nation.treasury - 40));
  if (invest <= 0) return;
  // 只在"下一个节点前置已满足"的线里选；有海战需求优先海军，和平优先经济，否则随机军事线
  const open = Object.keys(TECH_TREE).filter(t => techNextOpenable(nation, t));
  if (!open.length) return;
  let track = open[Math.floor(Math.random() * open.length)];
  if (nation.atWar.length && enemyOnlyBySea(game, nation) && open.includes('navy')) track = 'navy';
  else if (!nation.atWar.length && nation.tech.economy < 2 && open.includes('economy')) track = 'economy';
  investTech(game, nation, track, invest);
}

function enemyOnlyBySea(game, nation) {
  for (const eid of nation.atWar) {
    if (game.nations[eid] && game.nations[eid].alive && !areAdjacent(game, nation.id, eid)) return true;
  }
  return false;
}

// 海军建设：与敌国无陆路且敌国临海 → 造战船 / 研究航海
function aiNavalPlan(game, nation) {
  if (nation.tech.navy < 1) {
    investTech(game, nation, 'navy', ECONOMY.aiTechInvest);
  }
  const needsNavy = enemyOnlyBySea(game, nation);
  if (!needsNavy) return;
  const coastal = game.map.provinces.find(p => p.owner === nation.id && isCoastal(p));
  if (!coastal) return;
  const hasAnyNavy = game.map.provinces.some(p => p.owner === nation.id && hasNavy(p));
  if (!hasAnyNavy) recruitUnit(game, nation, coastal, 'galley');
}

function aiStrategy(game, nation) {
  const diff = DIFFICULTIES[game.settings.difficulty];
  if (nation.atWar.length) return;

  // 实力占优且相邻、关系平淡 → 宣战
  if (Math.random() < diff.aiAggression * 0.5) {
    let target = null, best = 0;
    for (const other of game.nations) {
      if (other.id === nation.id || !other.alive) continue;
      if (isAllied(game, nation.id, other.id) || hasTrade(game, nation.id, other.id)) continue;
      if (isAtWar(game, nation.id, other.id)) continue;
      if ((nation.relations[other.id] || 0) > 10) continue;
      if (!areAdjacent(game, nation.id, other.id)) continue;
      const cred = other.credibility || 50;
      if (cred > 70 && Math.random() < 0.7) continue;          // 忌惮高信誉国
      const ratio = powerRatio(game, nation.id, other.id);
      const threshold = cred < 25 ? 0.42 : 0.58;               // 低信誉国更易被入侵
      if (ratio > threshold && ratio > best) { best = ratio; target = other.id; }
    }
    if (target !== null) declareWar(game, nation.id, target);
  }
  // 弱而关系好 → 结盟 / 通商
  else if (Math.random() < 0.25) {
    for (const other of game.nations) {
      if (other.id === nation.id || !other.alive) continue;
      if (isAllied(game, nation.id, other.id) || hasTrade(game, nation.id, other.id)) continue;
      if (isAtWar(game, nation.id, other.id)) continue;
      const rel = nation.relations[other.id] || 0;
      const ratio = powerRatio(game, nation.id, other.id);
      if (ratio < 0.45 && rel > 30) { proposeAlliance(game, nation.id, other.id); break; }
      if (rel > 15) { proposeTrade(game, nation.id, other.id); break; }
    }
  }
}

// 大国博弈：玩家崛起时 AI 联手/宣战制造压力
function aiPolitic(game, nation) {
  const diff = DIFFICULTIES[game.settings.difficulty];
  const player = game.nations[game.playerId];
  if (!player || !player.alive || player.id === nation.id) return;
  const pTiles = nationTerritoryCount(game, player);
  const total = game.map.provinces.length;
  if (pTiles <= total * 0.22) return;   // 玩家尚未构成威胁
  const ratio = powerRatio(game, nation.id, player.id);

  // 实力足够 → 宣战玩家
  if (ratio > 0.5 && Math.random() < diff.aiAggression * 0.45) {
    if (!isAtWar(game, nation.id, player.id) && !isAllied(game, nation.id, player.id) &&
        !hasTrade(game, nation.id, player.id) && (nation.relations[player.id] || 0) < 15) {
      declareWar(game, nation.id, player.id);
      adjustRelation(game, nation.id, player.id, -15);
      return;
    }
  }
  // 弱国 → 与已在交战的其它国结盟对抗玩家
  if (ratio < 0.45 && Math.random() < diff.aiAggression * 0.35) {
    for (const other of game.nations) {
      if (other.id === nation.id || other.id === player.id || !other.alive) continue;
      if (!isAtWar(game, other.id, player.id)) continue;
      if (!isAllied(game, nation.id, other.id) && !isAtWar(game, nation.id, other.id)) {
        proposeAlliance(game, nation.id, other.id);
        break;
      }
    }
  }
}

// 每回合 AI 主入口
function runAI(game, nation) {
  if (!checkNationAlive(game, nation)) return;
  aiStrategy(game, nation);
  aiPolitic(game, nation);

  const enemies = enemyProvincesOf(game, nation);
  const armies = nationArmyProvinces(game, nation);

  for (const prov of armies) {
    if (!prov.army.length || prov.movesRemaining < 1) continue;

    if (enemies.length) {
      let target = null, bestD = 1e9;
      for (const e of enemies) {
        const d = approxDistance(prov, e);
        if (d < bestD) { bestD = d; target = e; }
      }
      if (target) {
        if (prov.neighbors.includes(target.id)) {
          tryAdvance(game, nation, prov, target);
        } else if (sameSea(prov, target) && hasNavy(prov)) {
          tryAdvance(game, nation, prov, target);
        } else {
          const step = stepToward(game, prov, target, nation);
          if (step && (step.owner === nation.id || step.owner === -1)) tryAdvance(game, nation, prov, step);
        }
        continue;
      }
    }

    // 和平扩张
    const exp = findExpansionTarget(game, nation, prov);
    if (exp) {
      if (exp.from.id === prov.id) tryAdvance(game, nation, prov, exp.to);
      else {
        const step = stepToward(game, prov, exp.from, nation);
        if (step && step.owner === nation.id) tryAdvance(game, nation, prov, step);
      }
    }
  }

  aiColonize(game, nation);   // 先殖民已驻军的无主地
  aiRecruit(game, nation);
  aiNavalPlan(game, nation);
  if (Math.random() < 0.8) aiBuild(game, nation);
  aiTech(game, nation);
}
