// state.js — 全局游戏状态、回合流程、胜利判定、存档（v3 六边形版）
'use strict';

let GAME = null;           // 当前游戏对象
const SAVE_KEY = 'empire_front_save_';

// 由六边形地图构建省份数组（含 id/center/neighbors/命中索引）
function buildProvinces(hexMap) {
  const provinces = [];
  const byKey = {};
  for (const tile of hexMap.tiles) {
    if (tile.terrainId === 'SEA') continue;
    const prov = {
      id: provinces.length,
      name: '格' + tile.q + '-' + tile.r,
      terrain: tile.terrainId,
      sea: tile.sea !== null ? tile.sea : null,
      coords: hexCorners(tile.q, tile.r),   // 像素顶点
      center: hexToPixel(tile.q, tile.r),   // 像素中心
      pop: tile.pop,
      owner: tile.owner,
      city: tile.city,
      capital: tile.capital,
      secondaryCapital: false,
      building: tile.building,
      army: tile.army,
      garrisonOwner: null,   // 无主地驻军归属者（驻军未殖民时记录谁在占领，null=无驻军）
      movesRemaining: 0,
      q: tile.q,
      r: tile.r,
      neighbors: [],
    };
    tile.provId = prov.id;
    provinces.push(prov);
    byKey[tileKey(tile.q, tile.r)] = prov.id;
  }
  // 陆地六邻接
  for (const tile of hexMap.tiles) {
    if (tile.terrainId === 'SEA' || tile.provId === undefined) continue;
    const prov = provinces[tile.provId];
    for (let d = 0; d < 6; d++) {
      const nb = hexNeighbor(tile.q, tile.r, d);
      const nid = byKey[tileKey(nb.q, nb.r)];
      if (nid !== undefined) prov.neighbors.push(nid);
    }
  }
  // 格子命中索引（像素 -> 省份）
  const provAtHex = {};
  for (const p of provinces) provAtHex[p.q + ',' + p.r] = p.id;
  return { provinces, provAtHex };
}

// 取省份
function provAt(game, id) {
  return (id >= 0 && id < game.map.provinces.length) ? game.map.provinces[id] : null;
}

// ---------- 创建新游戏 ----------
// settings: { difficulty, turnCap, playerNation(国家索引), seed?, scenario? }
function createGame(settings) {
  settings = Object.assign({ difficulty: 'easy', turnCap: 120, playerNation: 0, scenario: 'free' }, settings || {});
  const scn = getScenario(settings.scenario);
  const nationDefs = scn.nations ? scn.nations : null;
  const nationNames = nationDefs ? nationDefs.map(n => n.name) : Object.keys(WORLD_NATIONS);
  const nationCount = nationNames.length;
  const seed = (settings.seed !== undefined && settings.seed !== null)
    ? settings.seed
    : (scn.seed || Math.floor(Math.random() * 1e9));
  settings.seed = seed;
  const mw = scn.size ? scn.size.w : MAP_WIDTH;
  const mh = scn.size ? scn.size.h : MAP_HEIGHT;

  // 自选首都模式：生成地图时不分配给玩家首都/领土，由玩家点空地建立
  const skip = settings.chooseCapital ? settings.playerNation : -1;
  const hexMap = buildHexMap(seed, nationCount, mw, mh, skip);   // 生成大陆 + 分配国家
  const built = buildProvinces(hexMap);
  const provinces = built.provinces;

  const nations = nationNames.map((name, i) => {
    const def = nationDefs ? nationDefs[i] : null;
    return {
      id: i,
      name,
      color: def ? def.color : WORLD_NATIONS[name],
      leader: def ? (def.leader || null) : (WORLD_LEADERS[name] || null),
      isPlayer: i === settings.playerNation,
      alive: true,
      treasury: ECONOMY.startTreasury,
      goldIncome: 0,
      upkeep: 0,
      population: 0,
      units: 0,
      tech: { melee: 0, ranged: 0, artillery: 0, navy: 0, air: 0, economy: 0, culture: 0, education: 0 },
      techProgress: { melee: 0, ranged: 0, artillery: 0, navy: 0, air: 0, economy: 0, culture: 0, education: 0 },
      techInvest: { melee: 0, ranged: 0, artillery: 0, navy: 0, air: 0, economy: 0, culture: 0, education: 0 },   // 每回合研究投入（滑条）
      relations: {},
      atWar: [],
      allies: [],
      trades: [],
      policies: {},                     // 已实施的政策
      resistance: 100,                  // 抵抗度：归零则自动投降
      highestTiles: 0,                  // 历史最高领土格数
      credibility: 50,                  // 国际信誉(可信度) 0~100
    };
  });
  for (let i = 0; i < nationCount; i++)
    for (let j = 0; j < nationCount; j++)
      if (i !== j) nations[i].relations[j] = 0;

  const game = {
    version: 3,
    settings,
    scenario: scn.id !== 'free' ? scn.id : null,
    map: { provinces, provAtHex: built.provAtHex, width: mw, height: mh },
    nations,
    playerId: settings.playerNation,
    turn: 1,
    phase: settings.chooseCapital ? 'place_capital' : 'player',   // player | ai | ended | place_capital
    placeCapital: !!settings.chooseCapital,   // 自选首都进行中
    selected: null,       // 选中省 id
    active: null,         // 调派军队省 id
    events: [],
    winner: null,
    tutorial: null,       // 教程状态 { step, ... }
    _conqueredCount: 0,   // 玩家累计攻占敌省数（成就）
    _colonizedCount: 0,   // 玩家累计殖民无主地数（成就）
    _cityCount: 0,        // 玩家累计设立城市数（成就）
    _playerDeclared: false,  // 玩家是否主动宣战过（成就）
  };

  // 剧本初始关系：宣战 / 结盟 / 阵营
  if (scn.id !== 'free') {
    if (scn.startWar) for (const [a, b] of scn.startWar) {
      if (!nations[a] || !nations[b]) continue;
      nations[a].atWar.push(b); nations[b].atWar.push(a);
      adjustRelation(game, a, b, -50);
    }
    if (scn.startAlly) for (const [a, b] of scn.startAlly) {
      if (!nations[a] || !nations[b]) continue;
      nations[a].allies.push(b); nations[b].allies.push(a);
      adjustRelation(game, a, b, 30);
    }
    if (scn.camp) {
      for (const a of scn.camp.axis) for (const b of scn.camp.allies) {
        if (!nations[a] || !nations[b]) continue;
        if (!nations[a].atWar.includes(b)) nations[a].atWar.push(b);
        if (!nations[b].atWar.includes(a)) nations[b].atWar.push(a);
        adjustRelation(game, a, b, -50);
      }
    }
  }

  // 给部分无主土地放置土著守军（"土著政权"，需战斗击败才能殖民）；兵力零整不一，不超过 1000
  for (const prov of provinces) {
    if (prov.owner === -1 && !prov.army.length && Math.random() < 0.06) {
      prov.army.push({ type: 'native', soldiers: 100 + Math.floor(Math.random() * 900) });
      if (Math.random() < 0.12) prov.army.push({ type: 'native', soldiers: 100 + Math.floor(Math.random() * 900) });
    }
  }

  GAME = game;
  computeSeaNames(game);
  resetArmyMoves(game);
  // 开局即结算一次经济/兵力统计，让"士兵总数/人口"一开始就正确（含开局自带士兵）
  for (const n of nations) nationIncome(game, n);
  const p = nations[settings.playerNation];
  if (scn.id !== 'free') {
    addEvent(game, '📜 ' + scn.name + ' · 第 1 回合。你领导 ' + p.name + '，' + scn.desc);
  } else {
    addEvent(game, '🌍 苍澜大陆 · 第 1 回合。你领导 ' + p.name + '。');
  }
  return game;
}

// ---------- 事件日志 ----------
function addEvent(game, text) {
  if (!game) return;
  game.events.push({ turn: game.turn, text: String(text) });
  if (game.events.length > 300) game.events.shift();
}

// ---------- 结束回合 ----------
function endTurn() {
  if (!GAME || GAME.phase !== 'player' || GAME.winner !== null) return false;
  GAME.phase = 'ai';

  // 1) 经济结算
  for (const n of GAME.nations) if (n.alive) applyEconomy(GAME, n);

  // 2) AI 行动
  for (const n of GAME.nations) if (!n.isPlayer && n.alive) runAI(GAME, n);

  // 2.5) 随机事件（恐怖袭击/边境冲突/外交风云/经济事件）
  triggerRandomEvent(GAME);

  // 3) 抵抗度结算与投降 / 国际信誉
  updateResistance(GAME);
  updateCredibility(GAME);

  // 4) 胜利判定
  if (checkVictory(GAME) !== null) return true;

  // 4) 新回合
  GAME.turn++;
  GAME.phase = 'player';
  resetArmyMoves(GAME);
  GAME.selected = null;
  GAME.active = null;
  addEvent(GAME, '☀️ 第 ' + GAME.turn + ' 回合开始');

  checkVictory(GAME);
  checkAchievements(GAME);
  autoSave();
  return GAME.winner === null;
}

// ---------- 胜利判定 ----------
function checkVictory(game) {
  if (game.winner !== null) return game.winner;
  for (const n of game.nations) {
    if (n.alive && !checkNationAlive(game, n)) addEvent(game, '💀 ' + n.name + ' 已覆灭');
  }
  const alive = game.nations.filter(n => n.alive);
  if (alive.length === 0) { game.winner = -1; game.phase = 'ended'; return -1; }

  const total = game.map.provinces.length;
  const counts = {};
  for (const prov of game.map.provinces) {
    if (prov.owner !== -1) counts[prov.owner] = (counts[prov.owner] || 0) + 1;
  }

  if (alive.length === 1) {
    game.winner = alive[0].id;
    game.phase = 'ended';
    addEvent(game, '🏆 ' + alive[0].name + ' 统一了世界！');
    onVictory(game);
    return game.winner;
  }
  for (const n of alive) {
    const share = (counts[n.id] || 0) / total;
    if (share >= VICTORY_DOMINANCE) {
      game.winner = n.id;
      game.phase = 'ended';
      addEvent(game, '🏆 ' + n.name + ' 占领了 ' + Math.round(share * 100) + '% 的省份，达成统治！');
      onVictory(game);
      return game.winner;
    }
  }
  if (game.settings.turnCap > 0 && game.turn >= game.settings.turnCap) {
    let best = null, bestShare = -1;
    for (const n of alive) {
      const share = (counts[n.id] || 0) / total;
      if (share > bestShare) { bestShare = share; best = n.id; }
    }
    game.winner = best;
    game.phase = 'ended';
    addEvent(game, '⏰ 回合上限到达，' + game.nations[best].name + ' 以 ' + Math.round(bestShare * 100) + '% 领土获胜');
    onVictory(game);
    return best;
  }
  return null;
}

// ---------- 存档 ----------
function serializeGame(game) {
  return JSON.stringify({
    version: 3,
    savedAt: new Date().toISOString(),
    settings: game.settings,
    map: { provinces: game.map.provinces, width: game.map.width, height: game.map.height },   // provAtHex 读档时重建
    nations: game.nations,
    playerId: game.playerId,
    turn: game.turn,
    phase: game.phase,
    selected: game.selected,
    active: game.active,
    events: game.events,
    winner: game.winner,
    tutorial: game.tutorial,
  });
}

function deserializeGame(json) {
  const g = JSON.parse(json);
  if (!g || g.version !== 3) throw new Error('存档版本不兼容（当前为苍澜大陆版），请开始新游戏');
  if (!g.map || !g.map.provinces || !g.nations) throw new Error('存档数据损坏');
  // 重建格子命中索引
  if (!g.map.provAtHex) {
    g.map.provAtHex = {};
    for (const p of g.map.provinces) g.map.provAtHex[p.q + ',' + p.r] = p.id;
  }
  GAME = g;
  return g;
}

function hasLocalStorage() {
  try { return typeof localStorage !== 'undefined'; } catch (e) { return false; }
}

function saveSlot(slot) {
  if (!hasLocalStorage()) return { ok: false, msg: '当前环境不支持本地存储' };
  if (!GAME) return { ok: false, msg: '没有进行中的游戏' };
  try {
    localStorage.setItem(SAVE_KEY + slot, serializeGame(GAME));
    return { ok: true, msg: '已保存到槽位「' + slot + '」' };
  } catch (e) {
    return { ok: false, msg: '保存失败：' + e.message };
  }
}

function loadSlot(slot) {
  if (!hasLocalStorage()) return { ok: false, msg: '当前环境不支持本地存储' };
  const raw = localStorage.getItem(SAVE_KEY + slot);
  if (!raw) return { ok: false, msg: '槽位为空' };
  try {
    deserializeGame(raw);
    return { ok: true, msg: '已读取存档' };
  } catch (e) {
    return { ok: false, msg: '读取失败：' + e.message };
  }
}

function deleteSlot(slot) {
  if (hasLocalStorage()) localStorage.removeItem(SAVE_KEY + slot);
}

function listSlots() {
  const out = [];
  if (!hasLocalStorage()) return out;
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.indexOf(SAVE_KEY) === 0) {
      const slot = key.slice(SAVE_KEY.length);
      try {
        const g = JSON.parse(localStorage.getItem(key));
        if (!g || g.version !== 3) continue;   // 跳过旧版本存档
        out.push({ slot, turn: g.turn, nation: g.nations ? g.nations[g.playerId]?.name : '?', updated: g.savedAt || '' });
      } catch (e) { /* 忽略损坏存档 */ }
    }
  }
  return out;
}

function autoSave() {
  if (GAME && GAME.phase !== 'ended') saveSlot('auto');
}

// ============ 副首都 / 首都沦陷 / 抵抗度 / 投降（参考钢铁雄心4） ============
const SECONDARY_CAPITAL_COST = 80;

// 在自己领土设立副首都（每个国家只能有一个）
function establishSecondaryCapital(game, nation, prov) {
  if (prov.owner !== nation.id) return { ok: false, msg: '不是你的领土' };
  if (prov.capital) return { ok: false, msg: '主首都不可设为副首都' };
  if (prov.secondaryCapital) return { ok: false, msg: '此处已是副首都' };
  if (game.map.provinces.some(p => p.owner === nation.id && p.secondaryCapital)) return { ok: false, msg: '每个国家只能有一个副首都' };
  if (nation.treasury < SECONDARY_CAPITAL_COST) return { ok: false, msg: '金币不足（需 ' + SECONDARY_CAPITAL_COST + '）' };
  nation.treasury -= SECONDARY_CAPITAL_COST;
  prov.secondaryCapital = true;
  prov.city = true;
  addEvent(game, '🏛️ ' + nation.name + ' 设立副首都');
  return { ok: true, msg: '副首都设立成功' };
}

// 设立城市（区别于首都/副首都，提供城市产出与防守加成，可设多个）
function establishCity(game, nation, prov) {
  if (prov.owner !== nation.id) return { ok: false, msg: '不是你的领土' };
  if (prov.city) return { ok: false, msg: '此处已是城市' };
  if (nation.treasury < ECONOMY.cityCost) return { ok: false, msg: '金币不足（需 ' + ECONOMY.cityCost + '）' };
  nation.treasury -= ECONOMY.cityCost;
  prov.city = true;
  if (nation.id === game.playerId) game._cityCount = (game._cityCount || 0) + 1;
  addEvent(game, '🏙️ ' + nation.name + ' 在 ' + prov.name + ' 设立城市');
  return { ok: true, msg: '城市设立成功' };
}

// 殖民无主地：需自己的军队驻守，花费金币后设为己方领土
function colonizeProvince(game, nation, prov) {
  if (prov.owner !== -1) return { ok: false, msg: '这块地已有人统治，无需殖民' };
  if (!prov.army.length) return { ok: false, msg: '需有军队驻守才能殖民' };
  if (prov.garrisonOwner !== nation.id) return { ok: false, msg: '需你的军队驻守才能殖民' };
  if (nation.treasury < ECONOMY.colonizeCost) return { ok: false, msg: '金币不足（需 ' + ECONOMY.colonizeCost + '）' };
  nation.treasury -= ECONOMY.colonizeCost;
  prov.owner = nation.id;
  prov.garrisonOwner = null;
  if (nation.id === game.playerId) game._colonizedCount = (game._colonizedCount || 0) + 1;
  if (nation.leader && nation.leader.apply === 'conquer') prov.pop += nation.leader.value;   // 征服者：殖民增加人口
  addEvent(game, '🏴 ' + nation.name + ' 殖民了 ' + prov.name);
  return { ok: true, msg: '🏴 殖民成功！' };
}

// 自选首都：玩家点空地后确认，在此设立首都并外扩初始领土，然后正式开局
function finalizePlayerCapital(game, prov) {
  const p = game.nations[game.playerId];
  if (prov.owner !== -1 || prov.army.length) return { ok: false, msg: '请选择一块无主且无守军的空地' };
  prov.owner = game.playerId;
  prov.capital = true;
  prov.city = true;
  prov.pop = 3;
  // 初始守军（兵力零整不一，不超过 1000）
  for (let i = 0; i < (ECONOMY.startArmy || 2); i++) {
    prov.army.push({ type: 'swordsman', soldiers: 100 + Math.floor(Math.random() * 900) });
  }
  // 从首都外扩分配初始领土（严格六连通）
  const perNation = ECONOMY.startTilesPerNation || 5;
  const frontier = [prov.id];
  const seen = new Set([prov.id]);
  let collected = 1;
  while (collected < perNation && frontier.length) {
    const cur = frontier.shift();
    for (const nid of provAt(game, cur).neighbors) {
      if (seen.has(nid)) continue;
      seen.add(nid);
      const np = provAt(game, nid);
      if (np.owner !== -1) continue;
      np.owner = game.playerId;
      np.pop = 1 + Math.floor(Math.random() * 2);
      collected++;
      frontier.push(nid);
      if (collected >= perNation) break;
    }
  }
  // 结束选首都阶段
  game.placeCapital = false;
  game.phase = 'player';
  game.pendingCapital = null;
  game.selected = prov.id;
  addEvent(game, '👑 你选择在 ' + prov.name + ' 建立首都');
  nationIncome(game, p);
  centerCameraOnProvince(game, prov, 0.9);
  uiRefresh(game);
  return { ok: true, msg: '👑 首都建立，开局！' };
}

// 攻占对方首都：大幅降低对方抵抗度，有副首都则迁都
function handleCapitalFall(game, attacker, prov, defenderId) {
  const def = game.nations[defenderId];
  if (!def || !def.alive) return;
  let penalty = 60;
  if (attacker.leader && attacker.leader.apply === 'resistance') penalty += Math.abs(attacker.leader.value);
  def.resistance = Math.max(0, def.resistance - penalty);
  def.highestTiles = Math.max(def.highestTiles || 0, nationTerritoryCount(game, def));

  const sec = game.map.provinces.find(p => p.owner === defenderId && p.secondaryCapital);
  if (sec) {
    sec.capital = true;
    sec.secondaryCapital = false;
    sec.city = true;
    addEvent(game, '🏛️ ' + def.name + ' 首都沦陷，迁都至副首都（抵抗 -' + penalty + '）');
  } else {
    addEvent(game, '⚠️ ' + def.name + ' 的首都沦陷，抵抗意志大减（抵抗 -' + penalty + '）！');
  }
}

// 每回合抵抗度结算：无首都持续衰减、领土大减加速、归零则投降
function updateResistance(game) {
  for (const n of game.nations) {
    if (!n.alive) continue;
    if (n.resistance === undefined) n.resistance = 100;
    const cap = nationCapitalProvince(game, n);
    const tiles = nationTerritoryCount(game, n);
    if (n.highestTiles === undefined) n.highestTiles = tiles;
    n.highestTiles = Math.max(n.highestTiles, tiles);

    if (!cap) {
      n.resistance = Math.max(0, n.resistance - 10);
    } else {
      n.resistance = Math.min(100, n.resistance + 3);
    }
    if (n.highestTiles > 0 && tiles < n.highestTiles * 0.4) {
      n.resistance = Math.max(0, n.resistance - 8);
    }
    if (n.resistance <= 0) surrenderNation(game, n);
  }
}

// 每回合国际信誉结算：和平红利 + 履约奖励
function updateCredibility(game) {
  for (const n of game.nations) {
    if (!n.alive) continue;
    if (n.credibility === undefined) n.credibility = 50;
    let delta = 0;
    if (n.atWar.length === 0) delta += 1;                       // 和平红利
    if (n.trades.length + n.allies.length > 0 && n.atWar.length === 0) delta += 1;  // 履约守信
    if (delta) n.credibility = clamp(n.credibility + delta, 0, 100);
  }
}

// 投降：领土并入（交战中领土最多的敌国，若无则并入相邻国家）
function surrenderNation(game, nation) {
  let receiver = null, best = 0;
  for (const eid of nation.atWar) {
    const e = game.nations[eid];
    if (!e || !e.alive) continue;
    const t = nationTerritoryCount(game, e);
    if (t > best) { best = t; receiver = e; }
  }
  if (!receiver) {
    for (const prov of game.map.provinces) {
      if (prov.owner !== nation.id) continue;
      for (const nid of prov.neighbors) {
        const o = game.map.provinces[nid].owner;
        if (o !== -1 && o !== nation.id && game.nations[o] && game.nations[o].alive) { receiver = game.nations[o]; break; }
      }
      if (receiver) break;
    }
  }
  if (!receiver) receiver = game.nations[game.playerId] || null;

  for (const prov of game.map.provinces) {
    if (prov.owner === nation.id) {
      prov.owner = receiver ? receiver.id : -1;
      prov.capital = false;
      prov.secondaryCapital = false;
      prov.garrisonOwner = null;
      prov.army = [];
    }
  }
  nation.alive = false;
  nation.atWar = [];
  nation.allies = [];
  nation.trades = [];
  addEvent(game, '🏳️ ' + nation.name + ' 已投降，领土并入 ' + (receiver ? receiver.name : '各方') + '！');
  if (!getAchievements().historian) unlockAchievement('historian', game);
}

// ============ 随机事件（含恐怖袭击，刺激国际关系） ============
const RANDOM_EVENT_CHANCE = 0.35;   // 每回合触发概率

function triggerRandomEvent(game) {
  if (Math.random() > RANDOM_EVENT_CHANCE) return;
  const roll = Math.random();
  if (roll < 0.30) eventTerror(game);
  else if (roll < 0.45) eventBorderClash(game);
  else if (roll < 0.60) eventDiplomatic(game);
  else if (roll < 0.80) eventEconomic(game);
  else eventSocial(game);
}

function randomNation(game, excludeId) {
  const alive = game.nations.filter(n => n.alive && n.id !== excludeId);
  return alive[Math.floor(Math.random() * alive.length)] || game.nations[game.playerId];
}

// 恐怖袭击：受害者受损，舆论归咎敌国/关系最差国，恶化关系
function eventTerror(game) {
  const target = randomNation(game, null);
  if (!target || !target.alive) return;
  const owned = game.map.provinces.filter(p => p.owner === target.id);
  if (owned.length) {
    const prov = owned[Math.floor(Math.random() * owned.length)];
    prov.pop = Math.max(1, Math.round(prov.pop * 0.6));
    prov.building = null;
  }
  let culprit = null;
  for (const n of game.nations) {
    if (n.id === target.id || !n.alive) continue;
    if (target.atWar.includes(n.id)) { culprit = n; break; }
    if (!culprit || (target.relations[n.id] || 0) < (target.relations[culprit.id] || 0)) culprit = n;
  }
  if (culprit) {
    adjustRelation(game, target.id, culprit.id, -25);
    culprit.credibility = clamp((culprit.credibility === undefined ? 50 : culprit.credibility) - 10, 0, 100);
    addEvent(game, '💥 恐怖袭击！' + target.name + ' 境内遭袭，舆论直指 ' + culprit.name + '，两国关系急剧恶化！');
  } else {
    addEvent(game, '💥 恐怖袭击！' + target.name + ' 境内遭袭，社会动荡，人口与设施受损。');
  }
}

// 边境冲突：相邻国关系恶化，小概率升级为战争
function eventBorderClash(game) {
  const a = randomNation(game, null);
  let b = null;
  for (const prov of game.map.provinces) {
    if (prov.owner !== a.id) continue;
    for (const nid of prov.neighbors) {
      const o = game.map.provinces[nid].owner;
      if (o !== -1 && o !== a.id) { b = game.nations[o]; break; }
    }
    if (b) break;
  }
  if (!b) return;
  adjustRelation(game, a.id, b.id, -12);
  if (Math.random() < 0.2) {
    declareWar(game, a.id, b.id);
    addEvent(game, '🚧 边境冲突升级！' + a.name + ' 与 ' + b.name + ' 爆发战争！');
  } else {
    addEvent(game, '🚧 边境冲突！' + a.name + ' 与 ' + b.name + ' 在边境摩擦，关系恶化。');
  }
}

// 外交风云：两国关系随机升温/降温
function eventDiplomatic(game) {
  const a = randomNation(game, null);
  const b = randomNation(game, a.id);
  if (!b) return;
  const positive = Math.random() < 0.5;
  adjustRelation(game, a.id, b.id, positive ? 15 : -15);
  addEvent(game, positive
    ? '🤝 ' + a.name + ' 与 ' + b.name + ' 举行高层会晤，关系升温。'
    : '😠 ' + a.name + ' 与 ' + b.name + ' 爆发外交争端，关系恶化。');
}

// 经济事件：丰收/瘟疫/金矿/市场崩盘
function eventEconomic(game) {
  const roll = Math.random();
  if (roll < 0.4) {
    for (const n of game.nations) if (n.alive) n.treasury += 40;
    addEvent(game, '🌾 全球丰收！各国国库 +40 金币。');
  } else if (roll < 0.6) {
    const n = randomNation(game, null);
    for (const prov of game.map.provinces) if (prov.owner === n.id) prov.pop = Math.max(1, Math.round(prov.pop * 0.9));
    addEvent(game, '🦠 瘟疫肆虐 ' + n.name + '，人口锐减。');
  } else if (roll < 0.8) {
    const n = randomNation(game, null);
    n.treasury += 100;
    addEvent(game, '⛏️ ' + n.name + ' 发现金矿！国库 +100 金币。');
  } else {
    const n = randomNation(game, null);
    n.treasury = Math.max(0, n.treasury - 50);
    addEvent(game, '📉 ' + n.name + ' 遭遇市场崩盘，国库 -50 金币。');
  }
}

// 社会事件：演讲提抵抗 / 守信提信誉
function eventSocial(game) {
  const n = randomNation(game, null);
  if (Math.random() < 0.4) {
    n.resistance = Math.min(100, (n.resistance === undefined ? 100 : n.resistance) + 5);
    addEvent(game, '🎙️ ' + n.name + ' 领导人发表演讲，振奋民心（抵抗 +5）。');
  } else {
    n.credibility = clamp((n.credibility === undefined ? 50 : n.credibility) + 5, 0, 100);
    addEvent(game, '⭐ ' + n.name + ' 恪守国际承诺，信誉提升（信誉 +5）。');
  }
}

// ============ 成就系统 ============
const ACH_KEY = 'empire_front_achievements';

function getAchievements() {
  try { return JSON.parse(localStorage.getItem(ACH_KEY)) || {}; } catch (e) { return {}; }
}

function unlockAchievement(id, game) {
  if (!ACHIEVEMENTS[id]) return;
  const got = getAchievements();
  if (got[id]) return;
  got[id] = true;
  try { localStorage.setItem(ACH_KEY, JSON.stringify(got)); } catch (e) {}
  const a = ACHIEVEMENTS[id];
  toast('🏆 成就解锁：' + a.name);
  const g = game || GAME;
  if (g) addEvent(g, '🏆 成就解锁：' + a.icon + ' ' + a.name);
  if (typeof Sfx !== 'undefined' && Sfx.win) Sfx.win();
}

// 集中检查玩家成就条件（每回合/关键动作后调用）
function checkAchievements(game) {
  if (!game) return;
  const p = game.nations[game.playerId];
  if (!p || !p.alive) return;
  const got = getAchievements();
  const total = game.map.provinces.length;
  const pTiles = nationTerritoryCount(game, p);
  if (!got.firstBlood && (game._conqueredCount || 0) >= 1) unlockAchievement('firstBlood', game);
  if (!got.conqueror && (game._conqueredCount || 0) >= 30) unlockAchievement('conqueror', game);
  if (!got.hegemon && pTiles >= total * 0.5) unlockAchievement('hegemon', game);
  if (!got.rich && p.treasury >= 1000) unlockAchievement('rich', game);
  if (!got.scholar && nationMilitaryLevel(p) >= 3 && p.tech.economy >= 3 && p.tech.navy >= 2 && p.tech.air >= 2) unlockAchievement('scholar', game);
  if (!got.trader && p.trades.length >= 5) unlockAchievement('trader', game);
  if (!got.builder && (p.buildCount || 0) >= 20) unlockAchievement('builder', game);
  if (!got.survivor && p.atWar.length >= 3 && game.turn >= 20) unlockAchievement('survivor', game);
  if (!got.million && (p.population || 0) >= 100) unlockAchievement('million', game);
  if (!got.expansion && pTiles >= 50) unlockAchievement('expansion', game);
  if (!got.golden && p.treasury >= 10000) unlockAchievement('golden', game);
  if (!got.warlord && (game._conqueredCount || 0) >= 100) unlockAchievement('warlord', game);
  if (!got.warmonger && p.atWar.length >= 5) unlockAchievement('warmonger', game);
  if (!got.diplomat && (p.allies || []).length >= 3) unlockAchievement('diplomat', game);
  if (!got.colonizer && (game._colonizedCount || 0) >= 15) unlockAchievement('colonizer', game);
  if (!got.greatbuilder && (p.buildCount || 0) >= 50) unlockAchievement('greatbuilder', game);
  if (!got.citylord && (game._cityCount || 0) >= 5) unlockAchievement('citylord', game);
}

// 胜利时检查统一/和平成就
function onVictory(game) {
  if (game.winner === null || game.winner === -1 || game.winner !== game.playerId) return;
  if (!getAchievements().unifier) unlockAchievement('unifier', game);
  if (!game._playerDeclared && !getAchievements().pacifist) unlockAchievement('pacifist', game);
}

  <script>
// renderer.js — 六边形随机大陆渲染与相机（v3）
'use strict';

const CAMERA = { x: 0, y: 0, zoom: 1 };
// 放大到该比例以上才显示建筑/军队图标与数量（缩小后隐藏细节，避免遮挡，便于观察区块范围）
const ZOOM_SHOW_DETAILS = 0.6;

function getCanvas() {
  return document.getElementById('game-canvas');
}

// 六边形地图整体像素尺寸（支持剧本自定义尺寸）
function hexMapPixelSize(game) {
  const w = (game && game.map && game.map.width) || MAP_WIDTH;
  const h = (game && game.map && game.map.height) || MAP_HEIGHT;
  return {
    w: SQRT3 * HEX_SIZE * w,
    h: 1.5 * HEX_SIZE * h + HEX_SIZE,
  };
}

// 让地图适配视口并居中
function fitCamera(game) {
  const canvas = getCanvas();
  const W = canvas.clientWidth, H = canvas.clientHeight;
  const { w: mapW, h: mapH } = hexMapPixelSize(game);
  let zoom = Math.min(W / mapW, H / mapH) * 0.94;
  zoom = clamp(zoom, 0.15, 2.0);
  CAMERA.zoom = zoom;
  CAMERA.x = (W - mapW * zoom) / 2;
  CAMERA.y = (H - mapH * zoom) / 2;
}

// 把镜头居中到指定省份（首都地块），用给定缩放便于看清
function centerCameraOnProvince(game, prov, targetZoom) {
  if (!prov || !prov.center) return;
  const canvas = getCanvas();
  const W = canvas.clientWidth, H = canvas.clientHeight;
  const zoom = clamp(targetZoom || 1, 0.15, 3.0);
  CAMERA.zoom = zoom;
  CAMERA.x = W / 2 - prov.center.x * zoom;
  CAMERA.y = H / 2 - prov.center.y * zoom;
}

// 屏幕坐标 -> 六边形轴向坐标
function screenToHex(sx, sy) {
  const wx = (sx - CAMERA.x) / CAMERA.zoom;
  const wy = (sy - CAMERA.y) / CAMERA.zoom;
  return pixelToHex(wx, wy);
}

function shadeColor(hex, percent) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  const t = percent < 0 ? 0 : 255;
  const p = Math.abs(percent);
  return 'rgb(' + Math.round((t - r) * p + r) + ',' + Math.round((t - g) * p + g) + ',' + Math.round((t - b) * p + b) + ')';
}

function render(game) {
  if (!game) return;
  const canvas = getCanvas();
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (W === 0 || H === 0) return;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // 海洋背景
  const sea = ctx.createLinearGradient(0, 0, 0, H);
  sea.addColorStop(0, '#123a5e');
  sea.addColorStop(1, '#0d2a47');
  ctx.fillStyle = sea;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(CAMERA.x, CAMERA.y);
  ctx.scale(CAMERA.zoom, CAMERA.zoom);

  // 省份六边形
  for (const prov of game.map.provinces) {
    traceHexPath(ctx, prov.q, prov.r);
    const t = TERRAINS[prov.terrain];
    if (prov.owner !== -1) {
      const nc = game.nations[prov.owner].color;
      ctx.fillStyle = nc;
      ctx.globalAlpha = 0.68;
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (prov.garrisonOwner !== null && prov.garrisonOwner !== undefined) {
      // 无主地但有军队驻守：按驻军归属者淡色显示，标注"待殖民"
      const gc = game.nations[prov.garrisonOwner].color;
      ctx.fillStyle = gc;
      ctx.globalAlpha = 0.4;
      ctx.fill();
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = shadeColor(t.color, -0.12);
      ctx.fill();
    }
    ctx.lineWidth = 1.1;
    ctx.strokeStyle = 'rgba(8,16,26,0.85)';
    ctx.stroke();
  }

  // 已调派军队的可行动高亮
  if (game.active) {
    const ap = provAt(game, game.active);
    if (ap) drawActionHighlight(ctx, game, ap);
  }
  if (game.selected) {
    const sp = provAt(game, game.selected);
    if (sp) {
      traceHexPath(ctx, sp.q, sp.r);
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
    }
  }
  if (game.active) {
    const ap = provAt(game, game.active);
    if (ap) {
      traceHexPath(ctx, ap.q, ap.r);
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#4ade80';
      ctx.stroke();
    }
  }

  // 建筑与军队图标
  for (const prov of game.map.provinces) {
    drawProvinceIcons(ctx, prov);
  }

  // 首都标签（格子本身不显示名字，参考文明系列）
  if (CAMERA.zoom >= 0.5) drawCapitalLabels(ctx, game);

  ctx.restore();
}

function drawProvinceIcons(ctx, prov) {
  const c = prov.center;
  // 缩小到一定比例后隐藏细节（建筑/军队图标与数量），避免缩放造成的遮挡，便于观察区块范围
  const showDetails = CAMERA.zoom >= ZOOM_SHOW_DETAILS;
  if (prov.capital) drawText(ctx, '★', c.x - 4, c.y - 6, 13 / CAMERA.zoom, '#ffd54a', true);
  if (prov.secondaryCapital) drawText(ctx, '⚜️', c.x + 4, c.y + 4, 12 / CAMERA.zoom, '#7fb8ff', true);
  if (showDetails) {
    if (prov.building) drawEmoji(ctx, BUILDINGS[prov.building].icon, c.x, c.y, 16 / CAMERA.zoom);
    if (prov.army.length) drawArmy(ctx, prov, c);
  }
}

function drawArmy(ctx, prov, c) {
  const native = nativeSoldiers(prov);
  const soldiers = nationSoldiers(prov);
  // 两军并存：左侧土著 🗡️、右侧士兵 🪖，各自标注士兵数
  if (native > 0 && soldiers > 0) {
    drawEmoji(ctx, NATIVE_ICON, c.x - 8, c.y, 22 / CAMERA.zoom);
    drawArmyCount(ctx, c.x - 8, c.y + 11, native);
    drawEmoji(ctx, SOLDIER_ICON, c.x + 8, c.y, 22 / CAMERA.zoom);
    drawArmyCount(ctx, c.x + 8, c.y + 11, soldiers);
  } else if (soldiers > 0) {
    drawEmoji(ctx, SOLDIER_ICON, c.x, c.y, 23 / CAMERA.zoom);
    drawArmyCount(ctx, c.x + 11, c.y + 11, soldiers);
  } else if (native > 0) {
    drawEmoji(ctx, NATIVE_ICON, c.x, c.y, 23 / CAMERA.zoom);
    drawArmyCount(ctx, c.x + 11, c.y + 11, native);
  }
}

function drawArmyCount(ctx, x, y, n) {
  const fs = 13 / CAMERA.zoom;
  ctx.font = 'bold ' + fs + 'px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#000';
  ctx.strokeText(String(n), x, y);
  ctx.fillStyle = '#ffd54a';
  ctx.fillText(String(n), x, y);
}

function drawActionHighlight(ctx, game, activeProv) {
  // 陆地邻接：敌省红、空地绿、友方蓝
  for (const nid of activeProv.neighbors) {
    const p = game.map.provinces[nid];
    let color = null;
    if (p.owner === -1) color = 'rgba(74,222,128,0.45)';
    else if (p.owner === game.playerId) color = 'rgba(96,165,250,0.3)';
    else if (isAtWar(game, game.playerId, p.owner)) color = 'rgba(248,113,113,0.55)';
    else color = 'rgba(96,165,250,0.2)';
    traceHexPath(ctx, p.q, p.r);
    ctx.fillStyle = color;
    ctx.fill();
  }
  // 同海区沿海省：青色（海运目标）
  if (isCoastal(activeProv) && hasNavy(activeProv)) {
    for (const p of game.map.provinces) {
      if (p.id === activeProv.id) continue;
      if (p.sea === activeProv.sea) {
        traceHexPath(ctx, p.q, p.r);
        ctx.fillStyle = 'rgba(34,211,238,0.35)';
        ctx.fill();
      }
    }
  }
}

function drawCapitalLabels(ctx, game) {
  ctx.font = 'bold ' + (13 / CAMERA.zoom) + 'px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  for (const n of game.nations) {
    if (!n.alive) continue;
    const cap = nationCapitalProvince(game, n);
    if (!cap) continue;
    const c = cap.center;
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.85)';
    ctx.strokeText(n.name, c.x, c.y + 12 / CAMERA.zoom);
    ctx.fillStyle = '#fff';
    ctx.fillText(n.name, c.x, c.y + 12 / CAMERA.zoom);
  }
}

function drawEmoji(ctx, emoji, x, y, px) {
  ctx.font = px + 'px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(emoji, x, y);
}

function drawText(ctx, text, x, y, px, color, bold) {
  ctx.font = (bold ? 'bold ' : '') + px + 'px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

  panel.innerHTML = html;
  bindPanelButtons(panel);
  // 国家概况折叠开关
  const ov = panel.querySelector('[data-toggle="nation-overview"]');
  if (ov) ov.addEventListener('click', () => { nationOverviewCollapsed = !nationOverviewCollapsed; applyNationCollapse(); });
  applyNationCollapse();
}

function bindPanelButtons(panel) {
  panel.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', () => handlePanelAction(btn.dataset.action, btn.dataset.target));
    // 悬停显示 buff 说明（建筑 / 副首都 / 城市），移开淡出
    const hoverText = getHoverBuff(btn);
    if (hoverText) {
      btn.addEventListener('mouseenter', () => showBuildTip(hoverText));
      btn.addEventListener('mouseleave', hideBuildTip);
    }
  });
}
// 按钮悬停 buff 文案：建筑、副首都、城市
function getHoverBuff(btn) {
  const a = btn.dataset.action;
  if (a === 'build' && BUILDINGS[btn.dataset.target]) {
    const b = BUILDINGS[btn.dataset.target];
    return b.icon + ' ' + b.name + '：' + b.buff;
  }
  if (a === 'secondaryCapital') {
    return '🏛️ 设立副首都：产出 +' + ECONOMY.secondaryCapitalGold + ' 金币/回合；首都沦陷时自动迁都至此（全图仅一座）';
  }
  if (a === 'city') {
    return '🏙️ 设立城市：产出 +' + ECONOMY.cityGoldBonus + ' 金币/回合，人口增长 +' + Math.round(ECONOMY.cityGrowth * 100) + '%/回合';
  }
  return null;
}

let sliderOnConfirm = null;

function actionBtn(p, def, kind) {
  const disabled = p.treasury < def.cost;
  return '<button class="btn action-btn' + (disabled ? ' disabled' : '') + '" data-action="' + kind + '" data-target="' + def.id + '">' +
    def.icon + ' ' + def.name + '<span class="cost">💰' + def.cost + '</span></button>';
}

function handlePanelAction(action, target) {
  if (!GAME) return;
  // 自选首都：在 place_capital 阶段点击"建立首都"
  if (action === 'establishCapital') {
    const capProv = provAt(GAME, GAME.selected);
    const res = capProv ? finalizePlayerCapital(GAME, capProv) : null;
    if (res && res.msg) toast(res.msg);
    if (res && res.ok) { Sfx.build(); $('phase-banner').textContent = ''; }
    else Sfx.click();
    return;
  }
  if (GAME.phase !== 'player') return;
  // 无需选中格子的治理操作
  if (action === 'policy') { uiOpenPolicy(GAME); Sfx.click(); return; }
  if (action === 'tech') { uiOpenTech(GAME); Sfx.click(); return; }
  if (GAME.selected === null) return;
  const prov = provAt(GAME, GAME.selected);
  if (!prov) return;
  const p = GAME.nations[GAME.playerId];
  let res = null;
  if (action === 'build') { res = buildBuilding(GAME, p, prov, target); Sfx[res && res.ok ? 'build' : 'click'](); }
  else if (action === 'recruit') { res = recruitUnit(GAME, p, prov, target); Sfx[res && res.ok ? 'recruit' : 'click'](); }
  else if (action === 'selectArmy') { GAME.active = prov.id; Sfx.select(); }
  else if (action === 'cancelArmy') { GAME.active = null; Sfx.click(); }
  else if (action === 'secondaryCapital') { res = establishSecondaryCapital(GAME, p, prov); Sfx[res.ok ? 'build' : 'click'](); }
  else if (action === 'city') { res = establishCity(GAME, p, prov); Sfx[res.ok ? 'build' : 'click'](); }
  else if (action === 'colonize') { res = colonizeProvince(GAME, p, prov); Sfx[res.ok ? 'build' : 'click'](); }
  if (res && res.msg) toast(res.msg);
  if (res && res.ok) {
    if (action === 'build') tutorialCheck(GAME, 'build');
    else if (action === 'recruit') tutorialCheck(GAME, 'recruit');
    else if (action === 'colonize') tutorialCheck(GAME, 'colonize');
  }
  uiRefresh(GAME);
}

// ---------- 科技树界面（横向节点 + 前置跳转） ----------
function uiOpenTech(game) {
  if (!game) return;
  const p = game.nations[game.playerId];
  if (!p.techInvest) { p.techInvest = {}; for (const k of Object.keys(TECH_TREE)) p.techInvest[k] = 0; }
  let html = '';
  for (const track of Object.keys(TECH_TREE)) {
    const levels = TECH_TREE[track];
    const cur = p.tech[track] || 0;
    const openUnmet = techOpenUnmet(p, track);
    html += '<div class="tech-track"><div class="tech-track-title">' + TECH_TRACK_NAMES[track] + '</div>';
    if (openUnmet) {
      const nm = TECH_TRACK_NAMES[openUnmet.t] + '·' + (TECH_TREE[openUnmet.t] && TECH_TREE[openUnmet.t][openUnmet.l] ? TECH_TREE[openUnmet.t][openUnmet.l].name : openUnmet.l);
      html += '<div class="tech-open-lock" data-track="' + track + '" data-jump="' + openUnmet.t + '" data-lvl="' + openUnmet.l + '">🔒 本线未开启，需先研究 ' + nm + '（点击跳转）</div>';
    }
    html += '<div class="tech-nodes-row">';
    for (const lv of levels) {
      const owned = lv.id <= cur;
      const isNext = lv.id === cur + 1;
      const unmet = (openUnmet ? [openUnmet] : []).concat((lv.req || []).filter(r => (p.tech[r.t] || 0) < r.l));
      let cls = 'tech-node' + (owned ? ' owned' : '') + (isNext ? ' next' : '') + (unmet.length ? ' locked' : '');
      let label = lv.name;
      if (owned) label += ' ✔';
      else if (isNext) label += ' ' + Math.floor(p.techProgress[track] || 0) + '/' + lv.cost;
      else if (unmet.length) label += ' 🔒';
      const reqInfo = unmet.map(r => TECH_TRACK_NAMES[r.t] + '·' + (TECH_TREE[r.t] && TECH_TREE[r.t][r.l] ? TECH_TREE[r.t][r.l].name : r.l)).join('、');
      html += '<div class="' + cls + '" data-track="' + track + '" data-lvl="' + lv.id + '">' + label +
        (reqInfo ? '<div class="tech-req">需:' + reqInfo + '</div>' : '') + '</div>';
    }
    html += '</div>';
    const inv = p.techInvest[track] || 0;
    html += '<div class="tech-slider-row"><label>每回合投入 💰</label>' +
      '<input type="range" class="tech-slider" data-track="' + track + '" min="0" max="100" step="5" value="' + inv + '">' +
      '<span class="tech-slider-val" data-val="' + track + '">💰' + inv + '/回合</span></div>' +
      '<div class="tech-slider-hint">国库 💰' + p.treasury + ' · 已投入累计 💰' + Math.floor(p.techProgress[track] || 0) + '</div>';
    html += '</div>';
  }
  const canvas = $('tech-canvas');
  canvas.innerHTML = html;
  // 重新打开时回到左上角（避免停留在上次拖拽位置）
  const vp = $('tech-viewport');
  if (vp) { vp.scrollLeft = 0; vp.scrollTop = 0; }
  canvas.querySelectorAll('.tech-slider').forEach(sl => {
    sl.addEventListener('input', () => {
      const tr = sl.dataset.track;
      p.techInvest[tr] = parseInt(sl.value, 10) || 0;
      canvas.querySelector('[data-val="' + tr + '"]').textContent = '💰' + p.techInvest[tr] + '/回合';
      tutorialCheck(game, 'tech');
    });
  });
  // 未开启的科技线横幅：点击跳转到开启前置
  canvas.querySelectorAll('.tech-open-lock').forEach(el => {
    el.addEventListener('click', () => jumpToTech(el.dataset.jump, parseInt(el.dataset.lvl, 10)));
  });
  // 节点点击：点击"下一个"直接投入一次；点击锁定节点 → 跳转到所需前置
  canvas.querySelectorAll('.tech-node').forEach(nd => {
    nd.addEventListener('click', () => {
      const tr = nd.dataset.track, lvl = parseInt(nd.dataset.lvl, 10);
      const def = TECH_TREE[tr][lvl];
      if (nd.classList.contains('locked')) {
        const unmet = (def.req || []).find(r => (p.tech[r.t] || 0) < r.l);
        if (unmet) { toast('🔗 需要先研究：' + TECH_TRACK_NAMES[unmet.t] + '·' + (TECH_TREE[unmet.t][unmet.l] ? TECH_TREE[unmet.t][unmet.l].name : unmet.l)); jumpToTech(unmet.t, unmet.l); }
      } else if (nd.classList.contains('next')) {
        const res = investTech(game, p, tr, Math.max(ECONOMY.aiTechInvest, 10));
        toast(res.msg);
        uiRefresh(game); uiOpenTech(game);
      }
    });
  });
  $('tech-overlay').classList.remove('hidden');
  bindTechDrag();
}

// 跳转并高亮指定科技节点（滚动视口到该节点居中）
function jumpToTech(track, level) {
  uiOpenTech(GAME);
  const vp = $('tech-viewport');
  const el = vp.querySelector('[data-track="' + track + '"][data-lvl="' + level + '"]');
  if (el) {
    el.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });

    setTimeout(() => el.classList.remove('jump-highlight'), 1500);

}

// 科技树拖拽平移（钢铁雄心4式：按住空白处拖动）
let techDrag = null, techDragBound = false;
function bindTechDrag() {
  const vp = $('tech-viewport');
  if (!vp || techDragBound) return;
  techDragBound = true;
  vp.addEventListener('mousedown', e => {
    // 点击节点/滑条/按钮时不启动拖拽
    if (e.target.closest('.tech-node, .tech-slider, .btn, button, .tech-open-lock')) return;
    techDrag = { x: e.clientX, y: e.clientY, sl: vp.scrollLeft, st: vp.scrollTop, moved: false };
    vp.classList.add('dragging');
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!techDrag) return;
    const dx = e.clientX - techDrag.x, dy = e.clientY - techDrag.y;
    if (!techDrag.moved && (Math.abs(dx) > 3 || Math.abs(dy) > 3)) techDrag.moved = true;
    if (techDrag.moved) { vp.scrollLeft = techDrag.sl - dx; vp.scrollTop = techDrag.st - dy; }
  });
  window.addEventListener('mouseup', () => {
    techDrag = null;
    vp.classList.remove('dragging');
  });
}

// ---------- 外交界面 ----------
function uiOpenDiplomacy(game) {
  if (!game) return;
  const p = game.nations[game.playerId];
  let html = '';
  for (const n of game.nations) {
    if (n.id === game.playerId || !n.alive) continue;
    const rel = p.relations[n.id] || 0;
    const war = isAtWar(game, game.playerId, n.id);
    const allied = isAllied(game, game.playerId, n.id);
    const trade = hasTrade(game, game.playerId, n.id);
    const power = nationPower(game, n);
    const status = (war ? '⚔️ 交战 ' : '') + (allied ? '🤝 盟友 ' : '') + (trade ? '💰 贸易 ' : '') +
      (allied || trade || war ? '' : '中立') + ' · 信誉 ' + Math.round(n.credibility || 50);
    html += '<div class="dip-row">' +
      '<div class="dip-nation"><span class="dot" style="background:' + n.color + '"></span> ' + n.name + '</div>' +
      '<div class="dip-rel">关系 ' + rel + '</div>' +
      '<div class="dip-power">实力 ' + power.score + '（' + power.tiles + '省）</div>' +
      '<div class="dip-status">' + status + '</div>' +
      '<div class="dip-btns">' +
      (war
        ? '<button class="btn small" onclick="uiDipAction(' + n.id + ',\'peace\')">🕊️ 议和</button>'
        : '<button class="btn small danger" onclick="uiDipAction(' + n.id + ',\'war\')">⚔️ 宣战</button>') +
      (!allied && !war ? '<button class="btn small" onclick="uiDipAction(' + n.id + ',\'ally\')">🤝 结盟</button>' : '') +
      (!trade && !war ? '<button class="btn small" onclick="uiDipAction(' + n.id + ',\'trade\')">💰 通商</button>' : '') +
      '<button class="btn small" onclick="uiDipAction(' + n.id + ',\'gift\')">🎁 赠金</button>' +
      '</div></div>';
  }
  if (!html) html = '<div class="hint-text">没有可外交的对象</div>';
  $('diplomacy-body').innerHTML = html;
  $('diplomacy-overlay').classList.remove('hidden');
}

function uiDipAction(targetId, kind) {
  if (!GAME) return;
  const p = GAME.nations[GAME.playerId];
  let res;
  if (kind === 'war') res = declareWar(GAME, p.id, targetId);
  else if (kind === 'peace') res = proposePeace(GAME, p.id, targetId);
  else if (kind === 'ally') res = proposeAlliance(GAME, p.id, targetId);
  else if (kind === 'trade') res = proposeTrade(GAME, p.id, targetId);
  else if (kind === 'gift') {
    const amt = prompt('赠送多少金币？（至少 10）', '50');
    const a = parseInt(amt, 10);
    res = (isNaN(a) || a < 10) ? { ok: false, msg: '金额无效' } : offerGift(GAME, p.id, targetId, a);
  }
  if (res && res.msg) toast(res.msg);
  if (res && res.ok) {
    Sfx.select();
    tutorialCheck(GAME, 'diplomacy');
    if (kind === 'war') tutorialCheck(GAME, 'war');
  }
  uiRefresh(GAME);
  uiOpenDiplomacy(GAME);
}

function renderSaveSlots() {
  const slots = listSlots();

      '</div>';
  }).join('');

// ---------- 结算画面 ----------
function uiShowVictory(game) {
  const won = game.winner === game.playerId;
  const p = game.nations[game.playerId];
  const winner = game.nations[game.winner];
  const total = game.map.provinces.length;
  let counts = {};
  for (const prov of game.map.provinces) if (prov.owner !== -1) counts[prov.owner] = (counts[prov.owner] || 0) + 1;
  const pShare = Math.round(((counts[game.playerId] || 0) / total) * 100);
  const wShare = game.winner !== -1 ? Math.round(((counts[game.winner] || 0) / total) * 100) : 0;

  $('victory-title').textContent = won ? '🏆 胜 利' : '💀 战 败';
  $('victory-title').className = won ? 'victory-title win' : 'victory-title lose';
  $('victory-sub').innerHTML = won
    ? '<p>你以 <b>' + p.name + '</b> 的身份统治了世界！</p>'
    : (winner ? '<p>胜利者：<b>' + winner.name + '</b>（占领 ' + wShare + '% 省份）</p>' : '<p>战争结束了，无人幸存。</p>');
  $('victory-stats').innerHTML =
    '总回合：' + game.turn + '<br/>你的领土占比：' + pShare + '%<br/>你的国库：' + fmt(p.treasury) + ' 金币';
  $('victory-overlay').classList.remove('hidden');
  if (won) Sfx.win(); else Sfx.lose();
}

// ---------- 教程面板 ----------
function uiShowTutorial(game) {
  const panel = $('tutorial-panel');
  if (!game.tutorial) { panel.classList.add('hidden'); return; }
  const st = tutorialGetStep(game);
  if (!st) { panel.classList.add('hidden'); return; }
  panel.classList.remove('hidden');
  $('tutorial-text').innerHTML = st.title + '<br/><span class="tutorial-body">' + st.text + '</span>';
  $('btn-tut-skip').style.display = 'inline-block';
  $('btn-tut-next').style.display = st.advance === 'button' ? 'inline-block' : 'none';
}

function tutorialSkip() {
  if (!GAME) return;
  GAME.tutorial = null;
  $('tutorial-panel').classList.add('hidden');
  toast('已跳过教程');
}

// tutorial.js — 引导式第一局教程（v3 六边形版）
'use strict';

// advance: button=点下一步; clickProvince=点击任意省份; build/recruit/move/endTurn/tech/diplomacy/war=对应动作
const TUTORIAL_STEPS = [
  { id: 'welcome', title: '👋 欢迎来到帝国前线', text: '你将领导一个国家，征服随机生成的苍澜大陆。<br/>目标：占领 <b>60%</b> 的格子，或消灭所有对手。<br/>先看地图：彩色格子是各国领土，灰色是无政权或土著之地，蓝色是海洋。', advance: 'button' },
  { id: 'viewCountry', title: '🌍 看看你的国家', text: '你的省份会以你的国家颜色显示，首都标有 ★。<br/>点击任意省份，左侧会出现它的详情。试试看。', advance: 'clickProvince' },
  { id: 'build', title: '🏗️ 建造建筑', text: '国库里有金币。点击你的一个省份，在左侧「建造」区点 <b>农场</b>（增加人口和收入）。', advance: 'build', target: null },
  { id: 'recruit', title: '⚔️ 招募军队', text: '点击你首都所在的省份，在「征募」区招募一支 <b>刀剑手</b>（一支 400 名士兵）保护你的领地。', advance: 'recruit', target: null },
  { id: 'expand', title: '🏴 殖民扩张', text: '点击己方有军队的省份选中（自动调派），再点击<b>相邻的灰色省份</b>派出士兵驻守；然后在左侧点 <b>🏴 殖民</b> 按钮，花费 💰100 正式占领它！', advance: 'colonize', target: null },
  { id: 'endTurn', title: '⏭️ 结束回合', text: '按 <b>E</b> 或点底部「结束回合」。AI 国家也会行动，然后进入下一回合，你的国库会增长。', advance: 'endTurn' },
  { id: 'tech', title: '🔬 研究科技', text: '点左侧「打开科技树」，向「军事」线投入金币，解锁更强的步兵、火枪手甚至攻城车。', advance: 'tech' },
  { id: 'diplomacy', title: '🌐 外交', text: '打开顶部「外交」面板，与一个邻国建立<b>贸易协定</b>（+金币）或<b>结盟</b>（安全）。', advance: 'diplomacy' },
  { id: 'war', title: '⚔️ 开战与征服', text: '在外交面板向一个相邻国家<b>宣战</b>，然后用军队进攻它的省份！占领敌省能直接扩张你的版图。', advance: 'war' },
  { id: 'finish', title: '🏆 你的时代来了', text: '继续扩张、经营、外交、征服。达成 60% 领土或统一世界即可胜利！<br/>教程到此结束，尽情征服吧！', advance: 'button' },
];

function tutorialGetStep(game) {
  if (!game || !game.tutorial) return null;
  return TUTORIAL_STEPS[game.tutorial.step] || null;
}

function tutorialAdvance(game) {
  if (!game.tutorial) return;
  game.tutorial.step++;
  if (game.tutorial.step >= TUTORIAL_STEPS.length) {
    game.tutorial = null;
    toast('🎉 教程完成！去征服世界吧');
    $('tutorial-panel').classList.add('hidden');
    return;
  }
  uiShowTutorial(game);
  uiRefresh(game);
}

// 教程完成检测：在各动作处 hook
function tutorialCheck(game, action) {
  if (!game || !game.tutorial) return;
  const st = tutorialGetStep(game);
  if (!st) return;
  if (st.advance !== action) return;
  toast('✅ ' + st.title);
  tutorialAdvance(game);
}

// 教程目标省份（用于高亮）
function tutorialTargetProvince(game) {
  const st = tutorialGetStep(game);
  if (!st || !st.target) return null;
  for (const prov of game.map.provinces) {
    if (prov.name === st.target) return prov;
  }
  return null;
}

// 开始教程游戏（使用完整世界地图 + 引导）
function startTutorialGame() {
  startNewGame({
    difficulty: 'easy',
    turnCap: 0,
    playerNation: menuSelection.nation,
    scenario: 'free',
  }, true);
  const p = GAME.nations[GAME.playerId];
  p.treasury = 600; // 教程福利，保证步骤可完成
  uiRefresh(GAME);
  uiShowTutorial(GAME);
  Sfx.select();
}

// audio.js — 轻量 WebAudio 音效（无外部资源）
'use strict';

let audioCtx = null;
let SOUND_ON = true;

function ensureAudio() {
  if (!SOUND_ON) return null;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch (e) {
    return null;
  }
}

function playTone(freq, dur, type, vol) {
  const ctx = ensureAudio();
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.06, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  } catch (e) { /* 忽略 */ }
}

const Sfx = {
  click()   { playTone(620, 0.07, 'triangle', 0.05); },
  select()  { playTone(460, 0.10, 'sine', 0.05); },
  move()    { playTone(540, 0.08, 'sine', 0.05); },
  attack()  { playTone(170, 0.28, 'sawtooth', 0.07); playTone(120, 0.3, 'square', 0.05); },
  build()   { playTone(700, 0.12, 'triangle', 0.06); },
  recruit() { playTone(780, 0.10, 'square', 0.05); },
  turn()    { playTone(880, 0.14, 'sine', 0.06); },
  win()     { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playTone(f, 0.25, 'triangle', 0.08), i * 140)); },
  lose()    { [392, 330, 262].forEach((f, i) => setTimeout(() => playTone(f, 0.32, 'sine', 0.07), i * 200)); },
};

  <script>
// main.js — 入口、输入交互、回合流程、主循环（v3 六边形版）
'use strict';

// 启动
function boot() {
  uiSetupMenu();
  bindTopButtons();
  bindCanvas();
  bindHotkeys();
  bindSlider();
  renderMenuSaveSlots();
  $('menu-overlay').classList.remove('hidden');
  requestAnimationFrame(loop);
}

function loop() {
  try {
    render(GAME);
  } catch (e) {
    // 渲染异常不能中断动画循环，否则画面会永久冻结
    if (window.__renderErr !== e && window.__renderErr !== (e && e.stack)) {
      window.__renderErr = (e && e.stack) || e;
      console.error('渲染异常（已跳过该帧）：', e);
    }
  }
  requestAnimationFrame(loop);
}

// 开始新游戏；tutorialMode=true 时进入引导教程
function startNewGame(settings, tutorialMode) {
  GAME = createGame(settings);
  GAME.tutorial = tutorialMode ? { step: 0 } : null;
  $('menu-overlay').classList.add('hidden');
  $('diplomacy-overlay').classList.add('hidden');
  $('save-overlay').classList.add('hidden');
  $('victory-overlay').classList.add('hidden');
  $('tech-overlay').classList.add('hidden');
  $('tutorial-panel').classList.add('hidden');
  fitCamera(GAME);
  if (GAME.placeCapital) {
    // 自选首都：显示整图，提示玩家点空地选首都
    $('phase-banner').textContent = '🏗️ 点击一块空地选择你的首都位置，然后在左侧点「建立首都」';
  } else if (!tutorialMode) {
    // 开局自动滑到所选国家的首都地块（教程模式保持整图视野，便于引导）
    const cap = nationCapitalProvince(GAME, GAME.nations[GAME.playerId]);
    if (cap) centerCameraOnProvince(GAME, cap, 0.9);
  }
  uiRefresh(GAME);
  if (tutorialMode) uiShowTutorial(GAME);
  Sfx.select();
}

// 结束回合
function doEndTurn() {
  if (!GAME || GAME.phase !== 'player' || GAME.winner !== null) return;
  $('phase-banner').textContent = '🤖 AI 行动中…';
  setTimeout(() => {
    const cont = endTurn();
    $('phase-banner').textContent = '';
    if (GAME.winner !== null) {
      uiShowVictory(GAME);
    } else if (cont) {
      Sfx.turn();
    }
    uiRefresh(GAME);
    tutorialCheck(GAME, 'endTurn');
  }, 30);
}

// ---------- 顶部按钮 ----------
function bindTopButtons() {
  // 左右面板折叠
  $('btn-toggle-sidebar').addEventListener('click', () => {
    const c = $('sidebar').classList.toggle('collapsed');
    $('btn-toggle-sidebar').textContent = c ? '▶ 面板' : '◀ 面板';
    Sfx.click();
  });
  $('btn-toggle-event').addEventListener('click', () => {
    const c = $('event-panel').classList.toggle('collapsed');
    $('btn-toggle-event').textContent = c ? '日志 ◀' : '日志 ▶';
    Sfx.click();
  });
  $('btn-diplomacy').addEventListener('click', () => {
    if (!GAME) return;
    uiOpenDiplomacy(GAME);
    Sfx.click();
  });
  $('btn-save').addEventListener('click', () => {
    if (!GAME) return;
    uiOpenSave();
    Sfx.click();
  });
  $('btn-sound').addEventListener('click', () => {
    SOUND_ON = !SOUND_ON;
    $('btn-sound').textContent = SOUND_ON ? '🔊' : '🔇';
    if (SOUND_ON) Sfx.click();
  });
  $('btn-menu').addEventListener('click', () => {
    $('menu-overlay').classList.remove('hidden');
    $('btn-continue').style.display = GAME ? 'block' : 'none';
    renderMenuSaveSlots();
    Sfx.click();
  });
  $('btn-close-diplomacy').addEventListener('click', () => $('diplomacy-overlay').classList.add('hidden'));
  $('btn-close-save').addEventListener('click', () => $('save-overlay').classList.add('hidden'));
  $('btn-close-tech').addEventListener('click', () => $('tech-overlay').classList.add('hidden'));
  $('btn-close-policy').addEventListener('click', () => $('policy-overlay').classList.add('hidden'));
  $('btn-achievements').addEventListener('click', () => { uiOpenAchievements(); Sfx.click(); });
  $('btn-close-achievements').addEventListener('click', () => $('achievements-overlay').classList.add('hidden'));
  $('btn-restart').addEventListener('click', () => {
    $('victory-overlay').classList.add('hidden');
    $('menu-overlay').classList.remove('hidden');
    $('btn-continue').style.display = 'none';
    renderMenuSaveSlots();
  });
  $('btn-endturn').addEventListener('click', doEndTurn);
  $('btn-tut-skip').addEventListener('click', tutorialSkip);
  $('btn-tut-next').addEventListener('click', () => {
    if (GAME) tutorialAdvance(GAME);
  });
}

// ---------- 画布交互 ----------
function bindCanvas() {
  const canvas = getCanvas();
  let dragging = false, moved = false, lastX = 0, lastY = 0;

  canvas.addEventListener('mousedown', e => {
    dragging = true;
    moved = false;
    lastX = e.clientX;
    lastY = e.clientY;
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
    CAMERA.x += dx;
    CAMERA.y += dy;
    lastX = e.clientX;
    lastY = e.clientY;
  });
  window.addEventListener('mouseup', e => {
    if (dragging && !moved) onCanvasClick(e);
    dragging = false;
  });

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const factor = e.deltaY < 0 ? 1.16 : 1 / 1.16;
    zoomAt(sx, sy, factor);
  }, { passive: false });

  canvas.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (GAME) { GAME.active = null; uiRefresh(GAME); }
  });
}

function zoomAt(sx, sy, factor) {
  const old = CAMERA.zoom;
  const nz = clamp(CAMERA.zoom * factor, 0.15, 3.0);
  CAMERA.x = sx - (sx - CAMERA.x) * (nz / old);
  CAMERA.y = sy - (sy - CAMERA.y) * (nz / old);
  CAMERA.zoom = nz;
}

// 进攻/海运/拆分后统一收尾：提示、音效、刷新、教程、胜利判定
function finishMove(game, p, ap, prov, res) {
  if (!res) return;
  toast(res.msg);
  if (res.msg.indexOf('攻占') === 0 || res.msg.indexOf('被击退') !== -1) Sfx.attack();
  else if (res.ok) Sfx.move();
  else Sfx.click();
  if (ap.army.length === 0) game.active = null;
  game.selected = prov.id;
  uiRefresh(game);
  tutorialCheck(game, 'move');
  if (checkVictory(game) !== null) uiShowVictory(game);
}

// 屏幕点击 → 命中六边形格子（格子坐标 -> 省份 id 索引）
function onCanvasClick(e) {
  if (!GAME) return;
  if (GAME.phase !== 'player') {
    if (GAME.phase === 'place_capital') handleCapitalPick(GAME, e);
    return;
  }
  const rect = getCanvas().getBoundingClientRect();
  const h = screenToHex(e.clientX - rect.left, e.clientY - rect.top);
  const pid = GAME.map.provAtHex[h.q + ',' + h.r];
  if (pid === undefined || pid === null) return;   // 海洋或无格子
  handleProvinceClick(GAME, provAt(GAME, pid));
}

// 自选首都：点击空地 → 设为待建首都位置
function handleCapitalPick(game, e) {
  const rect = getCanvas().getBoundingClientRect();
  const h = screenToHex(e.clientX - rect.left, e.clientY - rect.top);
  const pid = game.map.provAtHex[h.q + ',' + h.r];
  if (pid === undefined || pid === null) { toast('请点击陆地'); return; }
  const prov = provAt(game, pid);
  if (prov.owner !== -1 || prov.army.length) { toast('请选择无主且无守军的空地'); return; }
  game.selected = prov.id;
  game.pendingCapital = prov.id;
  uiRefresh(game);
  tutorialCheck(game, 'clickProvince');
}

// 目标格是否敌对（敌国领土，或非己方军队驻守的无主地/土著）
function isHostileProv(game, prov) {
  if (prov.owner !== -1) return prov.owner !== game.playerId;
  return prov.army.length > 0 && prov.garrisonOwner !== game.playerId;
}

function handleProvinceClick(game, prov) {
  const p = game.nations[game.playerId];
  Sfx.click();

  // 有已调派军队：点击可达省份 → 进攻 / 拆分派遣 / 海运
  if (game.active !== null) {
    const ap = provAt(game, game.active);
    if (ap && ap.army.length && (ap.neighbors.includes(prov.id) || sameSea(ap, prov))) {
      if (isHostileProv(game, prov)) {
        // 敌省/土著 → 进攻
        finishMove(game, p, ap, prov, tryAdvance(game, p, ap, prov));
        return;
      }
      if (ap.neighbors.includes(prov.id)) {
        // 己方或无主地陆邻 → 滑条选派遣士兵数（step=1 确保能派全部；最少派 100）
        const avail = totalSoldiers(ap);
        const lo = Math.min(100, Math.max(1, avail));
        openSlider('派遣士兵', '派往 ' + prov.name + '（可派 ' + lo + '~' + avail + ' 名）', lo, Math.max(1, avail), 1,
          lo,
          (count) => finishMove(game, p, ap, prov, splitArmy(game, p, ap, prov, count)));
        return;
      }
      // 同海区海运 → 整队渡海
      finishMove(game, p, ap, prov, tryAdvance(game, p, ap, prov));
      return;
    }
    // 点击己方另一军队省 → 切换调派
    if (provOwnerId(prov) === game.playerId && prov.army.length) {
      game.active = prov.id;
      game.selected = prov.id;
      uiRefresh(game);
      return;
    }
    game.active = null;
  }

  // 不再自动调派：需点「调派这支军队」按钮后再点目标格（左键确认、右键取消）
  game.selected = prov.id;
  uiRefresh(game);
  tutorialCheck(game, 'clickProvince');
}

// ---------- 快捷键 ----------
function bindHotkeys() {
  window.addEventListener('keydown', e => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA')) return;
    if (e.key === 'Escape') {
      if (GAME) { GAME.active = null; uiRefresh(GAME); }
      return;
    }
    if (!GAME || GAME.phase !== 'player' || GAME.winner !== null) return;
    if (e.key === 'e' || e.key === 'E') doEndTurn();
    else if (e.key === 'd' || e.key === 'D') uiOpenDiplomacy(GAME);
  });
}

window.addEventListener('DOMContentLoaded', boot);

</script>
